    transform:
      type: transform
      signals:
        - traces
        - metrics
        - logs
        - profiles
      stability:
        logs: beta
        metrics: beta
        profiles: development
        traces: beta
      module: github.com/open-telemetry/opentelemetry-collector-contrib/processor/transformprocessor
      fields:
        type: map
        children:
          error_mode:
            type: string
            doc: ErrorMode determines how the processor reacts to errors that occur while processing a statement. Valid values are `ignore` and `propagate`. `ignore` means the processor ignores errors returned by statements and continues on to the next statement. This is the recommended mode. `propagate` means the processor returns the error up the pipeline.  This will result in the payload being dropped from the collector. The default value is `propagate`.
          flatten_data:
            type: bool
          log_statements:
            type: list
            children:
              item:
                type: map
                children:
                  conditions:
                    type: list
                    children:
                      item:
                        type: string
                  context:
                    type: string
                  error_mode:
                    type: string
                    doc: ErrorMode determines how the processor reacts to errors that occur while processing this group of statements. When provided, it overrides the default Config ErrorMode.
                  statements:
                    type: list
                    children:
                      item:
                        type: string
          metric_statements:
            type: list
            children:
              item:
                type: map
                children:
                  conditions:
                    type: list
                    children:
                      item:
                        type: string
                  context:
