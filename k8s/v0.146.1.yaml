    tail_sampling:
      type: tail_sampling
      signals:
        - traces
      stability:
        traces: beta
      module: github.com/open-telemetry/opentelemetry-collector-contrib/processor/tailsamplingprocessor
      fields:
        type: map
        children:
          block_on_overflow:
            type: bool
            doc: BlockOnOverflow determines the behavior when the component's NumTraces limit is reached. If true, the component will wait for space; otherwise, old traces will be evicted to make space.
          decision_cache:
            type: map
            children:
              non_sampled_cache_size:
                type: int
                doc: NonSampledCacheSize specifies the size of the cache that holds the non-sampled trace IDs. This value will be the maximum amount of trace IDs that the cache can hold before overwriting previous IDs. For effective use, this value should be at least an order of magnitude greater than Config.NumTraces. If left as default 0, a no-op DecisionCache will be used.
              sampled_cache_size:
                type: int
                doc: SampledCacheSize specifies the size of the cache that holds the sampled trace IDs. This value will be the maximum amount of trace IDs that the cache can hold before overwriting previous IDs. For effective use, this value should be at least an order of magnitude greater than Config.NumTraces. If left as default 0, a no-op DecisionCache will be used.
            doc: DecisionCache holds configuration for the decision cache(s)
          decision_wait:
            type: duration
            doc: DecisionWait is the desired wait time from the arrival of the first span of trace until the decision about sampling it or not is evaluated.
          decision_wait_after_root_received:
            type: duration
            doc: DecisionWaitAfterRootReceived is the desired wait time from the arrival of the root span of trace until the decision about sampling it or not is evaluated.
          drop_pending_traces_on_shutdown:
            type: bool
            doc: DropPendingTracesOnShutdown will drop all traces that are part of batches that have not yet reached the decision wait when the processor is shutdown.
          expected_new_traces_per_sec:
            type: int
            doc: ExpectedNewTracesPerSec sets the expected number of new traces sending to the tail sampling processor per second. This helps with allocating data structures with closer to actual usage size.
          maximum_trace_size_bytes:
            type: int
            doc: MaximumTraceSizeBytes is the largest size of a trace a decision will be made for. If the trace size exceeds this it will be dropped before the decision period to keep memory more predictable. A 0 value disables dropping large traces early.
          num_traces:
            type: int
            doc: NumTraces is the number of traces kept on memory. Typically most of the data of a trace is released after a sampling decision is taken.
          policies:
            type: list
            children:
              item:
                type: map
                children:
                  ExtensionCfg:
                    type: map
                    open: true
                    doc: Configs for any extensions that are used.
                  and:
                    type: map
                    children:
                      and_sub_policy:
                        type: list
                        children:
                          item:
                            type: map
                            children:
                              ExtensionCfg:
                                type: map
                                open: true
                                doc: Configs for any extensions that are used.
                              boolean_attribute:
                                type: map
                                children:
                                  invert_match:
                                    type: bool
                                    doc: InvertMatch indicates that values must not match against attribute values. If InvertMatch is true and Values is equal to 'true', all other values will be sampled except 'true'. Also, if the specified Key does not match any resource or span attributes, data will be sampled.
                                  key:
                                    type: string
                                    doc: Tag that the filter is going to be matching against.
                                  value:
                                    type: bool
                                    doc: Value indicate the bool value, either true or false to use when matching against attribute values. BooleanAttribute Policy will apply exact value match on Value
                                doc: Configs for boolean attribute filter sampling policy evaluator.
                              bytes_limiting:
                                type: map
                                children:
                                  burst_capacity:
                                    type: int
