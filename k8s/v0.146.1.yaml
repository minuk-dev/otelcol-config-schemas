        children:
          endpoint:
            type: string
            doc: The address to listen on for incoming Fluent Forward events.  Should be of the form `<ip addr>:<port>` (TCP) or `unix://<socket_path>` (Unix domain socket).
        doc: Config defines configuration for the fluentforward receiver.
    hostmetrics:
