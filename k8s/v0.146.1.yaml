                  error_mode:
                    type: string
                    doc: ErrorMode determines how the processor reacts to errors that occur while processing this group of statements. When provided, it overrides the default Config ErrorMode.
                  statements:
                    type: list
                    children:
                      item:
                        type: string
          profile_statements:
