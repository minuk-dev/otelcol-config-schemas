                    doc: ErrorMode determines how the processor reacts to errors that occur while processing this group of statements. When provided, it overrides the default Config ErrorMode.
                  statements:
                    type: list
                    children:
                      item:
                        type: string
          trace_statements:
            type: list
            children:
              item:
                type: map
                children:
                  conditions:
                    type: list
                    children:
                      item:
                        type: string
                  context:
                    type: string
                  error_mode:
                    type: string
                    doc: ErrorMode determines how the processor reacts to errors that occur while processing this group of statements. When provided, it overrides the default Config ErrorMode.
                  statements:
                    type: list
                    children:
                      item:
                        type: string
        doc: Config defines the configuration for the processor.
