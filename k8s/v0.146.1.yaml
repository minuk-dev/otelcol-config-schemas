collectorVersion: v0.146.1
distribution: k8s
generatedAt: "2026-08-09T10:56:58Z"
sources:
  k8s: github.com/open-telemetry/opentelemetry-collector-releases/k8s
components:
  connector:
    count:
      type: count
      stability:
        logs_to_metrics: alpha
        metrics_to_metrics: alpha
        profiles_to_metrics: alpha
        traces_to_metrics: alpha
      pairs:
        - from: logs
          to: metrics
        - from: metrics
          to: metrics
        - from: profiles
          to: metrics
        - from: traces
          to: metrics
      module: github.com/open-telemetry/opentelemetry-collector-contrib/connector/countconnector
      fields:
        type: map
        children:
          datapoints:
            type: map
            open: true
          logs:
            type: map
            open: true
          metrics:
            type: map
            open: true
          profiles:
            type: map
            open: true
          spanevents:
            type: map
            open: true
          spans:
            type: map
            open: true
        doc: Config for the connector
    exceptions:
      type: exceptions
      stability:
        traces_to_logs: alpha
        traces_to_metrics: alpha
      pairs:
        - from: traces
          to: logs
        - from: traces
          to: metrics
      module: github.com/open-telemetry/opentelemetry-collector-contrib/connector/exceptionsconnector
      fields:
        type: map
        children:
          dimensions:
            type: list
            children:
              item:
                type: map
                children:
                  default:
                    type: string
                  name:
                    type: string
                doc: Dimension defines the dimension name and optional default value if the Dimension is missing from a span attribute.
            doc: 'Dimensions defines the list of additional dimensions on top of the provided: - service.name - span.name - span.kind - status.code The dimensions will be fetched from the span''s attributes. Examples of some conventionally used attributes: https://github.com/open-telemetry/opentelemetry-collector/blob/main/model/semconv/opentelemetry.go.'
          exemplars:
            type: map
            children:
              enabled:
                type: bool
            doc: Exemplars defines the configuration for exemplars.
        doc: Config defines the configuration options for exceptionsconnector
    failover:
      type: failover
      stability:
        logs_to_logs: alpha
        metrics_to_metrics: alpha
        traces_to_traces: alpha
      pairs:
        - from: logs
          to: logs
        - from: metrics
          to: metrics
        - from: traces
          to: traces
      module: github.com/open-telemetry/opentelemetry-collector-contrib/connector/failoverconnector
      fields:
        type: map
        children:
          max_retries:
            type: int
            doc: MaxRetry is the maximum retries per level, once this limit is hit for a level, even if the next pipeline level fails, it will not try to recover the level that exceeded the maximum retries
          priority_levels:
            type: list
            children:
              item:
                type: list
                children:
                  item:
                    type: string
            doc: PipelinePriority is the list of pipeline level priorities in a 1 - n configuration, multiple pipelines can sit at a single priority level and will be routed in a fanout. If any pipeline at a level fails, the level is considered unhealthy
          retry_gap:
            type: duration
            doc: RetryGap is how much time will pass between trying two separate priority levels in a single RetryInterval If the priority list has 3 levels, the RetryInterval is 5m, and the retryGap is 1m, within the 5m RetryInterval, the connector will only try one level every 1m, and will return to the stable level in the interim
          retry_interval:
            type: duration
            doc: RetryInterval is the frequency at which the pipeline levels will attempt to recover by going over all levels below the current
          sending_queue:
            type: map
            children:
              batch:
                type: map
                children:
                  flush_timeout:
                    type: duration
                    doc: FlushTimeout sets the time after which a batch will be sent regardless of its size.
                  max_size:
                    type: int
                    doc: MaxSize defines the configuration for the maximum size of a batch.
                  min_size:
                    type: int
                    doc: MinSize defines the configuration for the minimum size of a batch.
                  sizer:
                    type: string
                    doc: Sizer determines the type of size measurement used by the batch. If not configured, use the same configuration as the queue. It accepts "requests", "items", or "bytes".
                doc: BatchConfig it configures how the requests are consumed from the queue and batch together during consumption.
              block_on_overflow:
                type: bool
                doc: BlockOnOverflow determines the behavior when the component's TotalSize limit is reached. If true, the component will wait for space; otherwise, operations will immediately return a retryable error.
              enabled:
                type: bool
                doc: Enabled indicates whether to not enqueue and batch before exporting.
              num_consumers:
                type: int
                doc: NumConsumers is the maximum number of concurrent consumers from the queue. This applies across all different optional configurations from above (e.g. wait_for_result, block_on_overflow, storage, etc.).
              queue_size:
                type: int
                doc: QueueSize represents the maximum data size allowed for concurrent storage and processing.
              sizer:
                type: string
                doc: Sizer determines the type of size measurement used by this component. It accepts "requests", "items", or "bytes".
              storage:
                type: string
                doc: 'StorageID if not empty, enables the persistent storage and uses the component specified as a storage extension for the persistent queue. TODO: This will be changed to Optional when available. See https://github.com/open-telemetry/opentelemetry-collector/issues/13822'
              wait_for_result:
                type: bool
                doc: WaitForResult determines if incoming requests are blocked until the request is processed or not. Currently, this option is not available when persistent queue is configured using the storage configuration.
            doc: QueueSettings use the exporterhelper sending_queue to move the queue to the connector to avoid data being stuck in the queue of an unhealthy exporter
    forward:
      type: forward
      stability:
        logs_to_logs: beta
        metrics_to_metrics: beta
        profiles_to_profiles: development
        traces_to_traces: beta
      pairs:
        - from: logs
          to: logs
        - from: metrics
          to: metrics
        - from: profiles
          to: profiles
        - from: traces
          to: traces
      module: go.opentelemetry.io/collector/connector/forwardconnector
    otlpjson:
      type: otlpjson
      stability:
        logs_to_logs: alpha
        logs_to_metrics: alpha
        logs_to_traces: alpha
      pairs:
        - from: logs
          to: logs
        - from: logs
          to: metrics
        - from: logs
          to: traces
      module: github.com/open-telemetry/opentelemetry-collector-contrib/connector/otlpjsonconnector
    roundrobin:
      type: roundrobin
      stability:
        logs_to_logs: beta
        metrics_to_metrics: beta
        traces_to_traces: beta
      pairs:
        - from: logs
          to: logs
        - from: metrics
          to: metrics
        - from: traces
          to: traces
      module: github.com/open-telemetry/opentelemetry-collector-contrib/connector/roundrobinconnector
    routing:
      type: routing
      stability:
        logs_to_logs: alpha
        metrics_to_metrics: alpha
        traces_to_traces: alpha
      pairs:
        - from: logs
          to: logs
        - from: metrics
          to: metrics
        - from: traces
          to: traces
      module: github.com/open-telemetry/opentelemetry-collector-contrib/connector/routingconnector
      fields:
        type: map
        children:
          default_pipelines:
            type: list
            children:
              item:
                type: string
            doc: DefaultPipelines contains the list of pipelines to use when a more specific record can't be found in the routing table. Optional.
          error_mode:
            type: string
            doc: ErrorMode determines how the processor reacts to errors that occur while processing an OTTL condition. Valid values are `ignore` and `propagate`. `ignore` means the processor ignores errors returned by conditions and continues on to the next condition. This is the recommended mode. If `ignore` is used and a statement's condition has an error then the payload will be routed to the default exporter. `propagate` means the processor returns the error up the pipeline.  This will result in the payload being dropped from the collector. The default value is `propagate`.
          table:
            type: list
            children:
              item:
                type: map
                children:
                  action:
                    type: string
                    doc: Action indicates the type of operation we intend to do when the condition Matches for the corresponding context and data.
                  condition:
                    type: string
                    doc: Condition is an OTTL condition used for making a routing decision. For the "request" context, 'Condition' is required and must be of the form 'request["<attribute>"] {== | !=} <value>'. For all other contexts, 'Statement' or 'Condition' must be provided, and must be a valid OTTL condition.
                  context:
                    type: string
                    doc: One of "request", "resource", "log", "span", "metric", "datapoint". Optional. Default "resource".
                  pipelines:
                    type: list
                    children:
                      item:
                        type: string
                    doc: Pipelines contains the list of pipelines to use when the value from the FromAttribute field matches this table item. When no pipelines are specified, the ones specified under DefaultPipelines are used, if any. The routing processor will fail upon the first failure from these pipelines. Optional.
                  statement:
                    type: string
                    doc: Statement is an OTTL statement used for making a routing decision. 'Statement' is disallowed for the "request" context. For other contexts, 'Statement' or 'Condition' must be provided.
                doc: RoutingTableItem specifies how data should be routed to the different pipelines
            doc: Table contains the routing table for this processor. Required.
        doc: Config defines configuration for the Routing processor.
    servicegraph:
      type: servicegraph
      stability:
        traces_to_metrics: alpha
      pairs:
        - from: traces
          to: metrics
      module: github.com/open-telemetry/opentelemetry-collector-contrib/connector/servicegraphconnector
      fields:
        type: map
        children:
          cache_loop:
            type: duration
            doc: CacheLoop is the time to cleans the cache periodically.
          database_name_attributes:
            type: list
            children:
              item:
                type: string
            doc: DatabaseNameAttributes is the attribute name list of attributes need to match used to identify the database name from span attributes, the higher the front, the higher the priority. The default value is {"db.name"}.
          dimensions:
            type: list
            children:
              item:
                type: string
            doc: 'Dimensions defines the list of additional dimensions on top of the provided: - client - server - failed - connection_type The dimensions will be fetched from the span''s attributes. Examples of some conventionally used attributes: https://github.com/open-telemetry/opentelemetry-collector/blob/main/model/semconv/opentelemetry.go.'
          exponential_histogram_max_size:
            type: int
            doc: ExponentialHistogramMaxSize is the setting of exponential histogram
          latency_histogram_buckets:
            type: list
            children:
              item:
                type: duration
            doc: LatencyHistogramBuckets is the list of durations representing latency histogram buckets. See defaultLatencyHistogramBucketsMs in processor.go for the default value. make sure use either `LatencyHistogramBuckets` or `ExponentialHistogramMaxSize`
          metrics_flush_interval:
            type: duration
            doc: MetricsFlushInterval is the interval at which metrics are flushed to the exporter. If set to 0, metrics are flushed on every received batch of traces. Default is 60s if unset.
          metrics_timestamp_offset:
            type: duration
            doc: MetricsTimestampOffset is the offset to subtract from metric timestamps. If set to a positive duration, metric timestamps will be set to (current time - offset), effectively shifting metrics to appear as if they were generated in the past. Default is 0, which means no offset is applied.
          store:
            type: map
            children:
              max_items:
                type: int
                doc: MaxItems is the maximum number of items to keep in the store.
              ttl:
                type: duration
                doc: TTL is the time to live for items in the store.
            doc: Store contains the config for the in-memory store used to find requests between services by pairing spans.
          store_expiration_loop:
            type: duration
            doc: CacheLoop is the time to expire old entries from the store periodically.
          virtual_node_extra_label:
            type: bool
            doc: VirtualNodeExtraLabel enables the `virtual_node` label to be added to the spans.
          virtual_node_peer_attributes:
            type: list
            children:
              item:
                type: string
            doc: VirtualNodePeerAttributes the list of attributes need to match, the higher the front, the higher the priority.
        doc: Config defines the configuration options for servicegraphprocessor.
    spanmetrics:
      type: spanmetrics
      stability:
        traces_to_metrics: alpha
      pairs:
        - from: traces
          to: metrics
      module: github.com/open-telemetry/opentelemetry-collector-contrib/connector/spanmetricsconnector
      fields:
        type: map
        children:
          add_resource_attributes:
            type: bool
            doc: Add the resource attributes to the resulting metrics (disabled by default) This option enables the old behavior https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/42103
          aggregation_cardinality_limit:
            type: int
          aggregation_temporality:
            type: string
          calls_dimensions:
            type: list
            children:
              item:
                type: map
                children:
                  default:
                    type: string
                  name:
                    type: string
                doc: Dimension defines the dimension name and optional default value if the Dimension is missing from a span attribute.
          dimensions:
            type: list
            children:
              item:
                type: map
                children:
                  default:
                    type: string
                  name:
                    type: string
                doc: Dimension defines the dimension name and optional default value if the Dimension is missing from a span attribute.
            doc: 'Dimensions defines the list of additional dimensions on top of the provided: - service.name - span.kind - span.kind - status.code - collector.instance.id This dimensions never added unless enable feature-gate connector.spanmetrics.includeCollectorInstanceID The dimensions will be fetched from the span''s attributes. Examples of some conventionally used attributes: https://github.com/open-telemetry/opentelemetry-collector/blob/main/model/semconv/opentelemetry.go.'
          dimensions_cache_size:
            type: int
            doc: 'DimensionsCacheSize defines the size of cache for storing Dimensions, which helps to avoid cache memory growing indefinitely over the lifetime of the collector. Optional. See defaultDimensionsCacheSize in connector.go for the default value. Deprecated [v0.130.0]:  Please use AggregationCardinalityLimit instead'
          events:
            type: map
            children:
              dimensions:
                type: list
                children:
                  item:
                    type: map
                    children:
                      default:
                        type: string
                      name:
                        type: string
                    doc: Dimension defines the dimension name and optional default value if the Dimension is missing from a span attribute.
                doc: Dimensions defines the list of dimensions to add to the events metric.
              enabled:
                type: bool
                doc: Enabled is a flag to enable events.
            doc: Events defines the configuration for events section of spans.
          exclude_dimensions:
            type: list
            children:
              item:
                type: string
          exemplars:
            type: map
            children:
              enabled:
                type: bool
              max_per_data_point:
                type: int
            doc: Exemplars defines the configuration for exemplars.
          histogram:
            type: map
            children:
              dimensions:
                type: list
                children:
                  item:
                    type: map
                    children:
                      default:
                        type: string
                      name:
                        type: string
                    doc: Dimension defines the dimension name and optional default value if the Dimension is missing from a span attribute.
              disable:
                type: bool
              explicit:
                type: map
                children:
                  buckets:
                    type: list
                    children:
                      item:
                        type: duration
                    doc: Buckets is the list of durations representing explicit histogram buckets.
              exponential:
                type: map
                children:
                  max_size:
                    type: int
              unit:
                type: string
          include_instrumentation_scope:
            type: list
            children:
              item:
                type: string
          metric_timestamp_cache_size:
            type: int
            doc: TimestampCacheSize controls the size of the cache used to keep track of delta metrics' TimestampUnixNano the last time it was flushed
          metrics_expiration:
            type: duration
            doc: MetricsExpiration is the time period after which, if no new spans are received, metrics are considered stale and will no longer be exported. Default value (0) means that the metrics will never expire.
          metrics_flush_interval:
            type: duration
            doc: MetricsEmitInterval is the time period between when metrics are flushed or emitted to the configured MetricsExporter.
          namespace:
            type: string
            doc: Namespace is the namespace of the metrics emitted by the connector.
          resource_metrics_cache_size:
            type: int
            doc: ResourceMetricsCacheSize defines the size of the cache holding metrics for a service. This is mostly relevant for cumulative temporality to avoid memory leaks and correct metric timestamp resets. Optional. See defaultResourceMetricsCacheSize in connector.go for the default value.
          resource_metrics_key_attributes:
            type: list
            children:
              item:
                type: string
            doc: ResourceMetricsKeyAttributes filters the resource attributes used to create the resource metrics key hash. This can be used to avoid situations where resource attributes may change across service restarts, causing metric counters to break (and duplicate). A resource does not need to have all of the attributes. The list must include enough attributes to properly identify unique resources or risk aggregating data from more than one service and span. e.g. ["service.name", "telemetry.sdk.language", "telemetry.sdk.name"] See https://opentelemetry.io/docs/specs/semconv/resource/ for possible attributes.
        doc: Config defines the configuration options for spanmetricsconnector.
  exporter:
    debug:
      type: debug
      signals:
        - traces
        - metrics
        - logs
        - profiles
      stability:
        logs: alpha
        metrics: alpha
        profiles: development
        traces: alpha
      module: go.opentelemetry.io/collector/exporter/debugexporter
      fields:
        type: map
        children:
          output_paths:
            type: list
            children:
              item:
                type: string
          sampling_initial:
            type: int
          sampling_thereafter:
            type: int
          sending_queue:
            type: map
            children:
              batch:
                type: map
                children:
                  flush_timeout:
                    type: duration
                  max_size:
                    type: int
                  min_size:
                    type: int
                  sizer:
                    type: string
              block_on_overflow:
                type: bool
              num_consumers:
                type: int
              queue_size:
                type: int
              sizer:
                type: string
              storage:
                type: string
              wait_for_result:
                type: bool
          use_internal_logger:
            type: bool
          verbosity:
            type: string
    file:
      type: file
      signals:
        - traces
        - metrics
        - logs
        - profiles
      stability:
        logs: alpha
        metrics: alpha
        profiles: development
        traces: alpha
      module: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/fileexporter
      fields:
        type: map
        children:
          append:
            type: bool
            doc: 'Mode defines whether the exporter should append to the file. Options: - false[default]:  truncates the file - true:  appends to the file.'
          compression:
            type: string
            doc: Compression Codec used to export telemetry data Supported compression algorithms:`zstd`
          create_directory:
            type: bool
            doc: CreateDirectory specifies that the parent directory of the output file should be created automatically on start.
          directory_permissions:
            type: string
            doc: DirectoryPermissions specifies permissions used when creating directories (minus process umask). Value must be an octal string like "0755".
          encoding:
            type: string
            doc: Encoding defines the encoding of the telemetry data. If specified, it overrides `FormatType` and applies an encoding extension.
          flush_interval:
            type: duration
            doc: FlushInterval is the duration between flushes. See time.ParseDuration for valid values.
          format:
            type: string
            doc: 'FormatType define the data format of encoded telemetry data Options: - json[default]:  OTLP json bytes. - proto:  OTLP binary protobuf bytes.'
          group_by:
            type: map
            children:
              enabled:
                type: bool
                doc: Enables group_by. Default is false.
              max_open_files:
                type: int
                doc: MaxOpenFiles specifies the maximum number of open file descriptors for the output files. The default is 100.
              resource_attribute:
                type: string
                doc: ResourceAttribute specifies the name of the resource attribute that contains the path segment of the file to write to. The final path will be the Path config value, with the * replaced with the value of this resource attribute. Default is "fileexporter.path_segment".
            doc: GroupBy enables writing to separate files based on a resource attribute.
          path:
            type: string
            doc: Path of the file to write to. Path is relative to current directory.
          rotation:
            type: map
            children:
              localtime:
                type: bool
                doc: LocalTime determines if the time used for formatting the timestamps in backup files is the computer's local time.  The default is to use UTC time.
              max_backups:
                type: int
                doc: MaxBackups is the maximum number of old log files to retain. The default is to 100 files.
              max_days:
                type: int
                doc: MaxDays is the maximum number of days to retain old log files based on the timestamp encoded in their filename.  Note that a day is defined as 24 hours and may not exactly correspond to calendar days due to daylight savings, leap seconds, etc. The default is not to remove old log files based on age.
              max_megabytes:
                type: int
                doc: MaxMegabytes is the maximum size in megabytes of the file before it gets rotated. It defaults to 100 megabytes.
            doc: Rotation defines an option about rotation of telemetry files.
        doc: Config defines configuration for file exporter.
    loadbalancing:
      type: loadbalancing
      signals:
        - traces
        - metrics
        - logs
      stability:
        logs: beta
        metrics: development
        traces: beta
      module: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/loadbalancingexporter
      fields:
        type: map
        children:
          enabled:
            type: bool
            doc: Enabled indicates whether to not retry sending batches in case of export failure.
          initial_interval:
            type: duration
            doc: InitialInterval the time to wait after the first failure before retrying.
          max_elapsed_time:
            type: duration
            doc: MaxElapsedTime is the maximum amount of time (including retries) spent trying to send a request/batch. Once this value is reached, the data is discarded. If set to 0, the retries are never stopped.
          max_interval:
            type: duration
            doc: MaxInterval is the upper bound on backoff interval. Once this value is reached the delay between consecutive retries will always be `MaxInterval`.
          multiplier:
            type: float
            doc: Multiplier is the value multiplied by the backoff interval bounds
          protocol:
            type: map
            children:
              otlp:
                type: map
                children:
                  auth:
                    type: map
                    children:
                      authenticator:
                        type: string
                  authority:
                    type: string
                  balancer_name:
                    type: string
                  compression:
                    type: string
                  endpoint:
                    type: string
                  headers: {}
                  keepalive:
                    type: map
                    children:
                      permit_without_stream:
                        type: bool
                      time:
                        type: duration
                      timeout:
                        type: duration
                  middlewares:
                    type: list
                    children:
                      item:
                        type: map
                        children:
                          id:
                            type: string
                  read_buffer_size:
                    type: int
                  retry_on_failure:
                    type: map
                    children:
                      enabled:
                        type: bool
                      initial_interval:
                        type: duration
                      max_elapsed_time:
                        type: duration
                      max_interval:
                        type: duration
                      multiplier:
                        type: float
                      randomization_factor:
                        type: float
                  sending_queue:
                    type: map
                    children:
                      batch:
                        type: map
                        children:
                          flush_timeout:
                            type: duration
                          max_size:
                            type: int
                          min_size:
                            type: int
                          sizer:
                            type: string
                      block_on_overflow:
                        type: bool
                      num_consumers:
                        type: int
                      queue_size:
                        type: int
                      sizer:
                        type: string
                      storage:
                        type: string
                      wait_for_result:
                        type: bool
                  timeout:
                    type: duration
                  tls:
                    type: map
                    children:
                      ca_file:
                        type: string
                      ca_pem:
                        type: string
                      cert_file:
                        type: string
                      cert_pem:
                        type: string
                      cipher_suites:
                        type: list
                        children:
                          item:
                            type: string
                      curve_preferences:
                        type: list
                        children:
                          item:
                            type: string
                      include_system_ca_certs_pool:
                        type: bool
                      insecure:
                        type: bool
                      insecure_skip_verify:
                        type: bool
                      key_file:
                        type: string
                      key_pem:
                        type: string
                      max_version:
                        type: string
                      min_version:
                        type: string
                      reload_interval:
                        type: duration
                      server_name_override:
                        type: string
                      tpm:
                        type: map
                        children:
                          auth:
                            type: string
                          enabled:
                            type: bool
                          owner_auth:
                            type: string
                          path:
                            type: string
                  wait_for_ready:
                    type: bool
                  write_buffer_size:
                    type: int
            doc: Protocol holds the individual protocol-specific settings. Only OTLP is supported at the moment.
          randomization_factor:
            type: float
            doc: RandomizationFactor is a random factor used to calculate next backoffs Randomized interval = RetryInterval * (1 ± RandomizationFactor)
          resolver:
            type: map
            children:
              aws_cloud_map:
                type: map
                children:
                  health_status:
                    type: map
                    open: true
                  interval:
                    type: duration
                  namespace:
                    type: string
                  port:
                    type: int
                  service_name:
                    type: string
                  timeout:
                    type: duration
              dns:
                type: map
                children:
                  hostname:
                    type: string
                  interval:
                    type: duration
                  port:
                    type: string
                  timeout:
                    type: duration
                doc: DNSResolver defines the configuration for the DNS resolver
              k8s:
                type: map
                children:
                  ports:
                    type: list
                    children:
                      item:
                        type: int
                  return_hostnames:
                    type: bool
                  service:
                    type: string
                  timeout:
                    type: duration
                doc: K8sSvcResolver defines the configuration for the DNS resolver
              static:
                type: map
                children:
                  hostnames:
                    type: list
                    children:
                      item:
                        type: string
                doc: StaticResolver defines the configuration for the resolver providing a fixed list of backends
            doc: ResolverSettings defines the configurations for the backend resolver
          retry_on_failure:
            type: map
            children:
              enabled:
                type: bool
              initial_interval:
                type: duration
              max_elapsed_time:
                type: duration
              max_interval:
                type: duration
              multiplier:
                type: float
              randomization_factor:
                type: float
          routing_attributes:
            type: list
            children:
              item:
                type: string
            doc: RoutingAttributes creates a composite routing key, based on several resource attributes of the application. Supports all attributes available (both resource and span), as well as the pseudo attributes "span.kind" and "span.name".
          routing_key:
            type: string
            doc: RoutingKey is a single routing key value
          sending_queue:
            type: map
            children:
              batch:
                type: map
                children:
                  flush_timeout:
                    type: duration
                    doc: FlushTimeout sets the time after which a batch will be sent regardless of its size.
                  max_size:
                    type: int
                    doc: MaxSize defines the configuration for the maximum size of a batch.
                  min_size:
                    type: int
                    doc: MinSize defines the configuration for the minimum size of a batch.
                  sizer:
                    type: string
                    doc: Sizer determines the type of size measurement used by the batch. If not configured, use the same configuration as the queue. It accepts "requests", "items", or "bytes".
                doc: BatchConfig it configures how the requests are consumed from the queue and batch together during consumption.
              block_on_overflow:
                type: bool
                doc: BlockOnOverflow determines the behavior when the component's TotalSize limit is reached. If true, the component will wait for space; otherwise, operations will immediately return a retryable error.
              enabled:
                type: bool
                doc: Enabled indicates whether to not enqueue and batch before exporting.
              num_consumers:
                type: int
                doc: NumConsumers is the maximum number of concurrent consumers from the queue. This applies across all different optional configurations from above (e.g. wait_for_result, block_on_overflow, storage, etc.).
              queue_size:
                type: int
                doc: QueueSize represents the maximum data size allowed for concurrent storage and processing.
              sizer:
                type: string
                doc: Sizer determines the type of size measurement used by this component. It accepts "requests", "items", or "bytes".
              storage:
                type: string
                doc: 'StorageID if not empty, enables the persistent storage and uses the component specified as a storage extension for the persistent queue. TODO: This will be changed to Optional when available. See https://github.com/open-telemetry/opentelemetry-collector/issues/13822'
              wait_for_result:
                type: bool
                doc: WaitForResult determines if incoming requests are blocked until the request is processed or not. Currently, this option is not available when persistent queue is configured using the storage configuration.
            doc: QueueBatchConfig defines configuration for queueing and batching for the exporter.
          timeout:
            type: duration
            doc: Timeout is the timeout for every attempt to send data to the backend. A zero timeout means no timeout.
        doc: Config defines configuration for the exporter.
    nop:
      type: nop
      signals:
        - traces
        - metrics
        - logs
        - profiles
      stability:
        logs: beta
        metrics: beta
        profiles: development
        traces: beta
      module: go.opentelemetry.io/collector/exporter/nopexporter
    otelarrow:
      type: otelarrow
      signals:
        - traces
        - metrics
        - logs
      stability:
        logs: beta
        metrics: beta
        traces: beta
      module: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/otelarrowexporter
      fields:
        type: map
        children:
          arrow:
            type: map
            children:
              disable_downgrade:
                type: bool
                doc: DisableDowngrade prevents this exporter from fallback back to standard OTLP.  If the Arrow service is unavailable, it will retry and/or fail.
              disabled:
                type: bool
                doc: Disabled prevents using OTel-Arrow streams.  The exporter falls back to standard OTLP.
              max_stream_lifetime:
                type: duration
                doc: 'MaxStreamLifetime should be set to less than the value of grpc: keepalive: max_connection_age_grace plus the timeout.'
              num_streams:
                type: int
                doc: NumStreams determines the number of OTel Arrow streams.
              payload_compression:
                type: string
                doc: PayloadCompression is applied on the Arrow IPC stream internally and may have different results from using gRPC-level compression.  This is disabled by default, since gRPC-level compression is enabled by default.  This can be set to "zstd" to turn on Arrow-Zstd compression. Note that `Zstd` applies to gRPC, not Arrow compression.
              prioritizer:
                type: string
                doc: Prioritizer is a policy name for how load is distributed across streams.
              zstd:
                type: map
                children:
                  concurrency:
                    type: int
                    doc: 'Concurrency is a Zstd-library parameter that configures the use of background goroutines to improve compression speed. 0 means to let the library decide (it will use up to GOMAXPROCS), and 1 means to avoid background workers.  (default: 1) See `zstdlib.WithEncoderConcurrency()`.'
                  level:
                    type: int
                    doc: 'Level is meaningful in the range [0, 10].  No invalid values, they all map into 4 default configurations.  (default: 5) See `zstdlib.WithEncoderLevel()`.'
                  window_size_mib:
                    type: int
                    doc: 'WindowSizeMiB is a Zstd-library parameter that controls how much window of text is visible to the compressor at a time. It is the dominant factor that determines memory usage. If zero, the window size is determined by level.  (default: 0) See `zstdlib.WithWindowSize()`.'
                doc: Zstd settings apply to OTel-Arrow use of gRPC specifically. Note that when multiple Otel-Arrow exporters are configured their settings will be applied in arbitrary order. Identical Zstd settings are recommended when multiple OTel-Arrow exporters are in use.
            doc: Arrow includes settings specific to OTel Arrow.
          auth:
            type: map
            children:
              authenticator:
                type: string
                doc: AuthenticatorID specifies the name of the extension to use in order to authenticate the incoming data point.
            doc: Auth configuration for outgoing RPCs.
          authority:
            type: string
            doc: WithAuthority parameter configures client to rewrite ":authority" header (godoc.org/google.golang.org/grpc#WithAuthority)
          balancer_name:
            type: string
            doc: Sets the balancer in grpclb_policy to discover the servers. Default is pick_first. https://github.com/grpc/grpc-go/blob/master/examples/features/load_balancing/README.md
          compression:
            type: string
            doc: The compression key for supported compression types within collector.
          endpoint:
            type: string
            doc: The target to which the exporter is going to send traces or metrics, using the gRPC protocol. The valid syntax is described at https://github.com/grpc/grpc/blob/master/doc/naming.md.
          headers:
            children:
              item:
                type: map
                children:
                  name:
                    type: string
                  value:
                    type: string
                    doc: String alias that is marshaled and printed in an opaque way. To recover the original value, cast it to a string.
                doc: Pair is an element of a MapList, and consists of a name and an opaque value.
            doc: The headers associated with gRPC requests.
          keepalive:
            type: map
            children:
              permit_without_stream:
                type: bool
              time:
                type: duration
              timeout:
                type: duration
            doc: The keepalive parameters for gRPC client. See grpc.WithKeepaliveParams. (https://godoc.org/google.golang.org/grpc#WithKeepaliveParams).
          metadata_cardinality_limit:
            type: int
            doc: MetadataCardinalityLimit indicates the maximum number of exporter instances that will be created through a distinct combination of MetadataKeys.
          metadata_keys:
            type: list
            children:
              item:
                type: string
            doc: MetadataKeys is a list of client.Metadata keys that will be used to form distinct exporters.  If this setting is empty, a single exporter instance will be used.  When this setting is not empty, one exporter will be used per distinct combination of values for the listed metadata keys. Empty value and unset metadata are treated as distinct cases. Entries are case-insensitive.  Duplicated entries will trigger a validation error.
          middlewares:
            type: list
            children:
              item:
                type: map
                children:
                  id:
                    type: string
                    doc: ID specifies the name of the extension to use.
                doc: Middleware defines the extension ID for a middleware component.
            doc: Middlewares for the gRPC client.
          read_buffer_size:
            type: int
            doc: ReadBufferSize for gRPC client. See grpc.WithReadBufferSize. (https://godoc.org/google.golang.org/grpc#WithReadBufferSize).
          retry_on_failure:
            type: map
            children:
              enabled:
                type: bool
                doc: Enabled indicates whether to not retry sending batches in case of export failure.
              initial_interval:
                type: duration
                doc: InitialInterval the time to wait after the first failure before retrying.
              max_elapsed_time:
                type: duration
                doc: MaxElapsedTime is the maximum amount of time (including retries) spent trying to send a request/batch. Once this value is reached, the data is discarded. If set to 0, the retries are never stopped.
              max_interval:
                type: duration
                doc: MaxInterval is the upper bound on backoff interval. Once this value is reached the delay between consecutive retries will always be `MaxInterval`.
              multiplier:
                type: float
                doc: Multiplier is the value multiplied by the backoff interval bounds
              randomization_factor:
                type: float
                doc: RandomizationFactor is a random factor used to calculate next backoffs Randomized interval = RetryInterval * (1 ± RandomizationFactor)
            doc: BackOffConfig defines configuration for retrying batches in case of export failure. The current supported strategy is exponential backoff.
          sending_queue:
            type: map
            children:
              batch:
                type: map
                children:
                  flush_timeout:
                    type: duration
                    doc: FlushTimeout sets the time after which a batch will be sent regardless of its size.
                  max_size:
                    type: int
                    doc: MaxSize defines the configuration for the maximum size of a batch.
                  min_size:
                    type: int
                    doc: MinSize defines the configuration for the minimum size of a batch.
                  sizer:
                    type: string
                    doc: Sizer determines the type of size measurement used by the batch. If not configured, use the same configuration as the queue. It accepts "requests", "items", or "bytes".
                doc: BatchConfig it configures how the requests are consumed from the queue and batch together during consumption.
              block_on_overflow:
                type: bool
                doc: BlockOnOverflow determines the behavior when the component's TotalSize limit is reached. If true, the component will wait for space; otherwise, operations will immediately return a retryable error.
              enabled:
                type: bool
                doc: Enabled indicates whether to not enqueue and batch before exporting.
              num_consumers:
                type: int
                doc: NumConsumers is the maximum number of concurrent consumers from the queue. This applies across all different optional configurations from above (e.g. wait_for_result, block_on_overflow, storage, etc.).
              queue_size:
                type: int
                doc: QueueSize represents the maximum data size allowed for concurrent storage and processing.
              sizer:
                type: string
                doc: Sizer determines the type of size measurement used by this component. It accepts "requests", "items", or "bytes".
              storage:
                type: string
                doc: 'StorageID if not empty, enables the persistent storage and uses the component specified as a storage extension for the persistent queue. TODO: This will be changed to Optional when available. See https://github.com/open-telemetry/opentelemetry-collector/issues/13822'
              wait_for_result:
                type: bool
                doc: WaitForResult determines if incoming requests are blocked until the request is processed or not. Currently, this option is not available when persistent queue is configured using the storage configuration.
            doc: QueueBatchConfig defines configuration for queueing and batching for the exporter.
          timeout:
            type: duration
            doc: Timeout is the timeout for every attempt to send data to the backend. A zero timeout means no timeout.
          tls:
            type: map
            children:
              ca_file:
                type: string
                doc: Path to the CA cert. For a client this verifies the server certificate. For a server this verifies client certificates. If empty uses system root CA. (optional)
              ca_pem:
                type: string
                doc: In memory PEM encoded cert. (optional)
              cert_file:
                type: string
                doc: Path to the TLS cert to use for TLS required connections. (optional)
              cert_pem:
                type: string
                doc: In memory PEM encoded TLS cert to use for TLS required connections. (optional)
              cipher_suites:
                type: list
                children:
                  item:
                    type: string
                doc: CipherSuites is a list of TLS cipher suites that the TLS transport can use. If left blank, a safe default list is used. See https://go.dev/src/crypto/tls/cipher_suites.go for a list of supported cipher suites.
              curve_preferences:
                type: list
                children:
                  item:
                    type: string
                doc: contains the elliptic curves that will be used in an ECDHE handshake, in preference order Defaults to empty list and "crypto/tls" defaults are used, internally.
              include_system_ca_certs_pool:
                type: bool
                doc: If true, load system CA certificates pool in addition to the certificates configured in this struct.
              insecure:
                type: bool
                doc: In gRPC and HTTP when set to true, this is used to disable the client transport security. See https://godoc.org/google.golang.org/grpc#WithInsecure for gRPC. Please refer to https://godoc.org/crypto/tls#Config for more information. (optional, default false)
              insecure_skip_verify:
                type: bool
                doc: InsecureSkipVerify will enable TLS but not verify the certificate.
              key_file:
                type: string
                doc: Path to the TLS key to use for TLS required connections. (optional)
              key_pem:
                type: string
                doc: In memory PEM encoded TLS key to use for TLS required connections. (optional)
              max_version:
                type: string
                doc: MaxVersion sets the maximum TLS version that is acceptable. If not set, refer to crypto/tls for defaults. (optional)
              min_version:
                type: string
                doc: MinVersion sets the minimum TLS version that is acceptable. If not set, TLS 1.2 will be used. (optional)
              reload_interval:
                type: duration
                doc: ReloadInterval specifies the duration after which the certificate will be reloaded If not set, it will never be reloaded (optional)
              server_name_override:
                type: string
                doc: ServerName requested by client for virtual hosting. This sets the ServerName in the TLSConfig. Please refer to https://godoc.org/crypto/tls#Config for more information. (optional)
              tpm:
                type: map
                children:
                  auth:
                    type: string
                  enabled:
                    type: bool
                  owner_auth:
                    type: string
                  path:
                    type: string
                    doc: The path to the TPM device or Unix domain socket. For instance /dev/tpm0 or /dev/tpmrm0.
                doc: Trusted platform module configuration
            doc: TLS struct exposes TLS client configuration.
          wait_for_ready:
            type: bool
            doc: WaitForReady parameter configures client to wait for ready state before sending data. (https://github.com/grpc/grpc/blob/master/doc/wait-for-ready.md)
          write_buffer_size:
            type: int
            doc: WriteBufferSize for gRPC gRPC. See grpc.WithWriteBufferSize. (https://godoc.org/google.golang.org/grpc#WithWriteBufferSize).
        doc: Config defines configuration for OTLP exporter.
