  processor:
    attributes:
      type: attributes
      signals:
        - traces
        - metrics
        - logs
      stability:
        logs: beta
        metrics: beta
        traces: beta
      module: github.com/open-telemetry/opentelemetry-collector-contrib/processor/attributesprocessor
      fields:
        type: map
        children:
          actions:
            type: list
            children:
              item:
                type: map
                children:
                  action:
                    type: string
                    doc: Action specifies the type of action to perform. The set of values are {INSERT, UPDATE, UPSERT, DELETE, HASH}. Both lower case and upper case are supported. INSERT -  Inserts the key/value to attributes when the key does not exist. No action is applied to attributes where the key already exists. Either Value, FromAttribute or FromContext must be set. UPDATE -  Updates an existing key with a value. No action is applied to attributes where the key does not exist. Either Value, FromAttribute or FromContext must be set. UPSERT -  Performs insert or update action depending on the attributes containing the key. The key/value is inserted to attributes that did not originally have the key. The key/value is updated for attributes where the key already existed. Either Value, FromAttribute or FromContext must be set. DELETE  - Deletes the attribute. If the key doesn't exist, no action is performed. HASH    - Calculates the SHA-1 hash of an existing value and overwrites the value with its SHA-1 hash result. If the feature gate `coreinternal.attraction.hash.sha256` is enabled, it uses SHA2-256 instead. EXTRACT - Extracts values using a regular expression rule from the input 'key' to target keys specified in the 'rule'. If a target key already exists, it will be overridden. CONVERT  - converts the type of an existing attribute, if convertable This is a required field.
                  converted_type:
                    type: string
                    doc: ConvertedType specifies the target type of an attribute to be converted If the key doesn't exist, no action is performed. If the value cannot be converted, the original value will be left as-is
                  default_value:
                    type: map
                    open: true
                    doc: DefaultValue specifies the value to use if Value/FromAttribute/FromContext doesn't provide a value (e.g., environment variable not set, attribute doesn't exist). Only used with INSERT, UPDATE, and UPSERT actions.
                  from_attribute:
                    type: string
                    doc: FromAttribute specifies the attribute to use to populate the value. If the attribute doesn't exist, no action is performed.
                  from_context:
                    type: string
                    doc: FromContext specifies the context value to use to populate the value. The values would be searched in client.Info.Metadata. If the key doesn't exist, no action is performed. If the key has multiple values the values will be joined with `;` separator.
                  key:
                    type: string
                    doc: Key specifies the attribute to act upon. This is a required field.
                  pattern:
                    type: string
                    doc: 'A regex pattern must be specified for the action EXTRACT. It uses the attribute specified by `key'' to extract values from The target keys are inferred based on the names of the matcher groups provided and the names will be inferred based on the values of the matcher group. Note: All subexpressions must have a name. Note: The value type of the source key must be a string. If it isn''t, no extraction will occur.'
                  value:
                    type: map
                    open: true
                    doc: Value specifies the value to populate for the key. The type of the value is inferred from the configuration.
                doc: ActionKeyValue specifies the attribute key to act upon.
            doc: Actions specifies the list of attributes to act on. The set of actions are {INSERT, UPDATE, UPSERT, DELETE, HASH, EXTRACT, CONVERT}. This is a required field.
          exclude:
            type: map
            children:
              attributes:
                type: list
                children:
                  item:
                    type: map
                    children:
                      key:
                        type: string
                        doc: Key specifies the attribute key.
                      value:
                        type: map
                        open: true
                        doc: Values specifies the value to match against. If it is not set, any value will match.
                    doc: Attribute specifies the attribute key and optional value to match against.
                doc: Attributes specifies the list of attributes to match against. All of these attributes must match for a match to occur. This is an optional field.
              libraries:
                type: list
                children:
                  item:
                    type: map
                    children:
                      name:
                        type: string
                      version:
                        type: string
                        doc: version match expected actual  match nil      <blank> yes nil      1       yes <blank>  <blank> yes <blank>  1       no 1        <blank> no 1        1       yes
                    doc: InstrumentationLibrary specifies the instrumentation library and optional version to match against.
                doc: Libraries specify the list of items to match the implementation library against. A match occurs if the span's implementation library matches at least one item in this list. This is an optional field.
              log_bodies:
                type: list
                children:
                  item:
                    type: string
                doc: LogBodies is a list of strings that the LogRecord's body field must match against.
              log_severity_number:
                type: map
                children:
                  match_undefined:
                    type: bool
                    doc: MatchUndefined controls whether logs with "undefined" severity matches. If this is true, entries with undefined severity will match.
                  min:
                    type: int
                    doc: Min is the lowest severity that may be matched. e.g. if this is plog.SeverityNumberInfo, INFO, WARN, ERROR, and FATAL logs will match.
                doc: LogSeverityNumber defines how to match against a log record's SeverityNumber, if defined.
              log_severity_texts:
                type: list
                children:
                  item:
                    type: string
