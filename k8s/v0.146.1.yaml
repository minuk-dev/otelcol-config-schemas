                        children:
                          auth:
                            type: string
                          enabled:
                            type: bool
                          owner_auth:
                            type: string
                          path:
                            type: string
                            doc: The path to the TPM device or Unix domain socket. For instance /dev/tpm0 or /dev/tpmrm0.
                        doc: Trusted platform module configuration
                    doc: TLS struct exposes TLS client configuration.
                  transport:
                    type: string
                  write_timeout:
                    type: duration
                    doc: WriteTimeout is the maximum duration before timing out writes of the response. It is reset whenever a new request's header is read. Like ReadTimeout, it does not let Handlers make decisions on a per-request basis. A zero or negative value means there will be no timeout.
                doc: ServerConfig defines settings for creating an HTTP server.
            doc: APIServer has the settings to enable the receiver to host the Prometheus API server in agent mode. This allows the user to call the endpoint to get the config, service discovery, and targets for debugging purposes.
          config:
            doc: PromConfig is a redeclaration of promconfig.Config because we need custom unmarshaling as prometheus "config" uses `yaml` tags.
          report_extra_scrape_metrics:
            type: bool
            doc: 'ReportExtraScrapeMetrics - enables reporting of additional metrics for Prometheus client like scrape_body_size_bytes Deprecated: use the feature gate "receiver.prometheusreceiver.EnableReportExtraScrapeMetrics" instead.'
          target_allocator:
            type: map
            children:
              auth:
                type: map
                children:
                  authenticator:
                    type: string
                    doc: AuthenticatorID specifies the name of the extension to use in order to authenticate the incoming data point.
                doc: Auth configuration for outgoing HTTP calls.
              collector_id:
                type: string
              compression:
                type: string
                doc: The compression key for supported compression types within collector.
              compression_params:
                type: map
                children:
                  level:
                    type: int
                doc: Advanced configuration options for the Compression
              cookies:
                type: map
                open: true
                doc: Cookies configures the cookie management of the HTTP client.
              disable_keep_alives:
                type: bool
                doc: 'DisableKeepAlives, if true, disables HTTP keep-alives and will only use the connection to the server for a single HTTP request. WARNING: enabling this option can result in significant overhead establishing a new HTTP(S) connection for every request. Before enabling this option please consider whether changes to idle connection settings can achieve your goal.'
              endpoint:
                type: string
                doc: 'The target URL to send data to (e.g.: http://some.url:9411/v1/traces).'
              force_attempt_http2:
                type: bool
                doc: 'Enabling ForceAttemptHTTP2 forces the HTTP transport to use the HTTP/2 protocol. By default, this is set to true. NOTE: HTTP/2 does not support settings such as MaxConnsPerHost, MaxIdleConnsPerHost and MaxIdleConns.'
              headers:
                children:
                  item:
                    type: map
                    children:
                      name:
                        type: string
                      value:
                        type: string
                        doc: String alias that is marshaled and printed in an opaque way. To recover the original value, cast it to a string.
                    doc: Pair is an element of a MapList, and consists of a name and an opaque value.
                doc: Additional headers attached to each HTTP request sent by the client. Existing header values are overwritten if collision happens. Header values are opaque since they may be sensitive.
              http_scrape_config: {}
              http_sd_config:
                doc: PromHTTPSDConfig is a redeclaration of promHTTP.SDConfig because we need custom unmarshaling as prometheus "config" uses `yaml` tags.
              http2_ping_timeout:
                type: duration
                doc: HTTP2PingTimeout if there's no response to the ping within the configured value, the connection will be closed. If not set or set to 0, it defaults to 15s.
              http2_read_idle_timeout:
                type: duration
                doc: This is needed in case you run into https://github.com/golang/go/issues/59690 https://github.com/golang/go/issues/36026 HTTP2ReadIdleTimeout if the connection has been idle for the configured value send a ping frame for health check 0s means no health check will be performed.
              idle_conn_timeout:
                type: duration
                doc: IdleConnTimeout is the maximum amount of time a connection will remain open before closing itself. By default, it is set to 90 seconds.
              interval:
                type: duration
              max_conns_per_host:
                type: int
                doc: MaxConnsPerHost limits the total number of connections per host, including connections in the dialing, active, and idle states. Default is 0 (unlimited).
              max_idle_conns:
                type: int
                doc: MaxIdleConns is used to set a limit to the maximum idle HTTP connections the client can keep open. By default, it is set to 100. Zero means no limit.
              max_idle_conns_per_host:
                type: int
                doc: MaxIdleConnsPerHost is used to set a limit to the maximum idle HTTP connections the host can keep open. If zero, [net/http.DefaultMaxIdleConnsPerHost] is used.
              middlewares:
                type: list
                children:
                  item:
                    type: map
                    children:
                      id:
                        type: string
                        doc: ID specifies the name of the extension to use.
                    doc: Middleware defines the extension ID for a middleware component.
                doc: Middlewares are used to add custom functionality to the HTTP client. Middleware handlers are called in the order they appear in this list, with the first middleware becoming the outermost handler.
              proxy_url:
                type: string
                doc: ProxyURL setting for the collector
              read_buffer_size:
                type: int
                doc: ReadBufferSize for HTTP client. See http.Transport.ReadBufferSize. Default is 0.
              timeout:
                type: duration
                doc: Timeout parameter configures `http.Client.Timeout`. Default is 0 (unlimited).
              tls:
                type: map
                children:
                  ca_file:
                    type: string
                    doc: Path to the CA cert. For a client this verifies the server certificate. For a server this verifies client certificates. If empty uses system root CA. (optional)
                  ca_pem:
                    type: string
                    doc: In memory PEM encoded cert. (optional)
                  cert_file:
                    type: string
                    doc: Path to the TLS cert to use for TLS required connections. (optional)
                  cert_pem:
                    type: string
                    doc: In memory PEM encoded TLS cert to use for TLS required connections. (optional)
                  cipher_suites:
                    type: list
                    children:
                      item:
                        type: string
                    doc: CipherSuites is a list of TLS cipher suites that the TLS transport can use. If left blank, a safe default list is used. See https://go.dev/src/crypto/tls/cipher_suites.go for a list of supported cipher suites.
                  curve_preferences:
                    type: list
                    children:
                      item:
                        type: string
                    doc: contains the elliptic curves that will be used in an ECDHE handshake, in preference order Defaults to empty list and "crypto/tls" defaults are used, internally.
                  include_system_ca_certs_pool:
                    type: bool
                    doc: If true, load system CA certificates pool in addition to the certificates configured in this struct.
                  insecure:
                    type: bool
                    doc: In gRPC and HTTP when set to true, this is used to disable the client transport security. See https://godoc.org/google.golang.org/grpc#WithInsecure for gRPC. Please refer to https://godoc.org/crypto/tls#Config for more information. (optional, default false)
                  insecure_skip_verify:
                    type: bool
                    doc: InsecureSkipVerify will enable TLS but not verify the certificate.
                  key_file:
                    type: string
                    doc: Path to the TLS key to use for TLS required connections. (optional)
                  key_pem:
                    type: string
                    doc: In memory PEM encoded TLS key to use for TLS required connections. (optional)
                  max_version:
                    type: string
                    doc: MaxVersion sets the maximum TLS version that is acceptable. If not set, refer to crypto/tls for defaults. (optional)
                  min_version:
                    type: string
                    doc: MinVersion sets the minimum TLS version that is acceptable. If not set, TLS 1.2 will be used. (optional)
                  reload_interval:
                    type: duration
                    doc: ReloadInterval specifies the duration after which the certificate will be reloaded If not set, it will never be reloaded (optional)
                  server_name_override:
                    type: string
                    doc: ServerName requested by client for virtual hosting. This sets the ServerName in the TLSConfig. Please refer to https://godoc.org/crypto/tls#Config for more information. (optional)
                  tpm:
                    type: map
                    children:
                      auth:
                        type: string
                      enabled:
                        type: bool
                      owner_auth:
                        type: string
                      path:
                        type: string
                        doc: The path to the TPM device or Unix domain socket. For instance /dev/tpm0 or /dev/tpmrm0.
                    doc: Trusted platform module configuration
                doc: TLS struct exposes TLS client configuration.
              write_buffer_size:
                type: int
                doc: WriteBufferSize for HTTP client. See http.Transport.WriteBufferSize. Default is 0.
            doc: ClientConfig defines settings for creating an HTTP client.
          trim_metric_suffixes:
            type: bool
        doc: Config defines configuration for Prometheus receiver.
