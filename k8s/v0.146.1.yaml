    otelarrow:
      type: otelarrow
      signals:
        - traces
        - metrics
        - logs
      stability:
        logs: beta
        metrics: beta
        traces: beta
      module: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/otelarrowreceiver
      fields:
        type: map
        children:
          admission:
            type: map
            children:
              request_limit_mib:
                type: int
                doc: RequestLimitMiB limits the number of requests that are received by the stream based on uncompressed request size. Request size is used to control how much traffic we admit for processing.  When this field is zero, admission control is disabled.
              waiting_limit_mib:
                type: int
                doc: WaitingLimitMiB is the limit on the amount of data waiting to be consumed. This is a dimension of memory limiting to ensure waiters are not consuming an unexpectedly large amount of memory in the arrow receiver.
            doc: Admission is the configuration for controlling amount of request memory entering the receiver.
          arrow:
            type: map
            children:
              admission_limit_mib:
                type: int
                doc: 'Deprecated: This field is no longer supported, use cfg.Admission.RequestLimitMiB instead.'
              memory_limit_mib:
                type: int
                doc: MemoryLimitMiB is the size of a shared memory region used by all Arrow streams, in MiB.  When too much load is passing through, they will see ResourceExhausted errors.
              waiter_limit:
                type: int
                doc: 'Deprecated: This field is no longer supported, use cfg.Admission.WaiterLimit instead.'
              zstd:
                type: map
                children:
                  concurrency:
                    type: int
                    doc: 'Concurrency is a Zstd-library parameter that configures the use of background goroutines to improve decompression speed. 0 means to let the library decide (it will use up to GOMAXPROCS), and 1 means to avoid background workers.  (default: 1) See `zstdlib.WithDecoderConcurrency()`.'
                  max_window_size_mib:
                    type: int
                    doc: MaxWindowSizeMiB limits window sizes that can be configured in the corresponding encoder's `EncoderConfig.WindowSizeMiB` setting, as a way to control memory usage. See `zstdlib.WithDecoderMaxWindow()`.
                  memory_limit_mib:
                    type: int
                    doc: MemoryLimitMiB is a memory limit control for the decoder, as a way to limit overall memory use by Zstd. See `zstdlib.WithDecoderMaxMemory()`.
                doc: Zstd settings apply to OTel-Arrow use of gRPC specifically.
            doc: ArrowConfig support configuring the Arrow receiver.
          grpc:
            type: map
            children:
              auth:
                type: map
                children:
                  authenticator:
                    type: string
                    doc: AuthenticatorID specifies the name of the extension to use in order to authenticate the incoming data point.
                doc: Auth for this receiver
              dialer:
                type: map
                children:
                  timeout:
                    type: duration
                    doc: Timeout is the maximum amount of time a dial will wait for a connect to complete. The default is no timeout.
                doc: DialerConfig contains options for connecting to an address.
              endpoint:
                type: string
                doc: Endpoint configures the address for this network connection. For TCP and UDP networks, the address has the form "host:port". The host must be a literal IP address, or a host name that can be resolved to IP addresses. The port must be a literal port number or a service name. If the host is a literal IPv6 address it must be enclosed in square brackets, as in "[2001:db8::1]:80" or "[fe80::1%zone]:80". The zone specifies the scope of the literal IPv6 address as defined in RFC 4007.
              include_metadata:
                type: bool
                doc: Include propagates the incoming connection's metadata to downstream consumers.
              keepalive:
                type: map
                children:
                  enforcement_policy:
                    type: map
                    children:
                      min_time:
                        type: duration
                      permit_without_stream:
                        type: bool
                    doc: KeepaliveEnforcementPolicy allow configuration of the keepalive.EnforcementPolicy. The same default values as keepalive.EnforcementPolicy are applicable and get applied by the server. See https://godoc.org/google.golang.org/grpc/keepalive#EnforcementPolicy for details.
                  server_parameters:
                    type: map
                    children:
                      max_connection_age:
                        type: duration
                      max_connection_age_grace:
                        type: duration
                      max_connection_idle:
                        type: duration
                      time:
                        type: duration
                      timeout:
                        type: duration
                    doc: KeepaliveServerParameters allow configuration of the keepalive.ServerParameters. The same default values as keepalive.ServerParameters are applicable and get applied by the server. See https://godoc.org/google.golang.org/grpc/keepalive#ServerParameters for details.
                doc: Keepalive anchor for all the settings related to keepalive.
              max_concurrent_streams:
                type: int
                doc: MaxConcurrentStreams sets the limit on the number of concurrent streams to each ServerTransport. It has effect only for streaming RPCs.
              max_recv_msg_size_mib:
                type: int
                doc: MaxRecvMsgSizeMiB sets the maximum size (in MiB) of messages accepted by the server.
              middlewares:
                type: list
                children:
                  item:
                    type: map
                    children:
                      id:
                        type: string
                        doc: ID specifies the name of the extension to use.
                    doc: Middleware defines the extension ID for a middleware component.
                doc: Middlewares for the gRPC server.
              read_buffer_size:
                type: int
                doc: ReadBufferSize for gRPC server. See grpc.ReadBufferSize. (https://godoc.org/google.golang.org/grpc#ReadBufferSize).
              tls:
                type: map
                children:
                  ca_file:
                    type: string
                    doc: Path to the CA cert. For a client this verifies the server certificate. For a server this verifies client certificates. If empty uses system root CA. (optional)
                  ca_pem:
                    type: string
                    doc: In memory PEM encoded cert. (optional)
                  cert_file:
                    type: string
                    doc: Path to the TLS cert to use for TLS required connections. (optional)
                  cert_pem:
                    type: string
                    doc: In memory PEM encoded TLS cert to use for TLS required connections. (optional)
                  cipher_suites:
                    type: list
                    children:
                      item:
                        type: string
                    doc: CipherSuites is a list of TLS cipher suites that the TLS transport can use. If left blank, a safe default list is used. See https://go.dev/src/crypto/tls/cipher_suites.go for a list of supported cipher suites.
                  client_ca_file:
                    type: string
                    doc: Path to the TLS cert to use by the server to verify a client certificate. (optional) This sets the ClientCAs and ClientAuth to RequireAndVerifyClientCert in the TLSConfig. Please refer to https://godoc.org/crypto/tls#Config for more information. (optional)
                  client_ca_file_reload:
                    type: bool
                    doc: Reload the ClientCAs file when it is modified (optional, default false)
                  curve_preferences:
                    type: list
                    children:
                      item:
                        type: string
                    doc: contains the elliptic curves that will be used in an ECDHE handshake, in preference order Defaults to empty list and "crypto/tls" defaults are used, internally.
                  include_system_ca_certs_pool:
                    type: bool
                    doc: If true, load system CA certificates pool in addition to the certificates configured in this struct.
                  key_file:
                    type: string
                    doc: Path to the TLS key to use for TLS required connections. (optional)
                  key_pem:
                    type: string
                    doc: In memory PEM encoded TLS key to use for TLS required connections. (optional)
                  max_version:
                    type: string
                    doc: MaxVersion sets the maximum TLS version that is acceptable. If not set, refer to crypto/tls for defaults. (optional)
                  min_version:
                    type: string
                    doc: MinVersion sets the minimum TLS version that is acceptable. If not set, TLS 1.2 will be used. (optional)
                  reload_interval:
                    type: duration
                    doc: ReloadInterval specifies the duration after which the certificate will be reloaded If not set, it will never be reloaded (optional)
                  tpm:
                    type: map
                    children:
                      auth:
                        type: string
                      enabled:
                        type: bool
                      owner_auth:
                        type: string
                      path:
                        type: string
                        doc: The path to the TPM device or Unix domain socket. For instance /dev/tpm0 or /dev/tpmrm0.
                    doc: Trusted platform module configuration
                doc: Configures the protocol to use TLS. The default value is nil, which will cause the protocol to not use TLS.
              transport:
                type: string
                doc: Transport to use. Allowed protocols are "tcp", "tcp4" (IPv4-only), "tcp6" (IPv6-only), "udp", "udp4" (IPv4-only), "udp6" (IPv6-only), "ip", "ip4" (IPv4-only), "ip6" (IPv6-only), "unix", "unixgram" and "unixpacket".
              write_buffer_size:
                type: int
                doc: WriteBufferSize for gRPC server. See grpc.WriteBufferSize. (https://godoc.org/google.golang.org/grpc#WriteBufferSize).
            doc: ServerConfig defines common settings for a gRPC server configuration.
          protocols:
            type: map
            children:
              arrow:
                type: map
                children:
                  admission_limit_mib:
                    type: int
                  memory_limit_mib:
                    type: int
                  waiter_limit:
                    type: int
                  zstd:
                    type: map
                    children:
                      concurrency:
                        type: int
                      max_window_size_mib:
                        type: int
                      memory_limit_mib:
                        type: int
              grpc:
                type: map
                children:
                  auth:
                    type: map
                    children:
                      authenticator:
                        type: string
                  dialer:
                    type: map
                    children:
                      timeout:
                        type: duration
                  endpoint:
                    type: string
                  include_metadata:
                    type: bool
                  keepalive:
                    type: map
                    children:
                      enforcement_policy:
                        type: map
                        children:
                          min_time:
                            type: duration
                          permit_without_stream:
                            type: bool
                      server_parameters:
                        type: map
                        children:
                          max_connection_age:
                            type: duration
                          max_connection_age_grace:
                            type: duration
                          max_connection_idle:
                            type: duration
                          time:
                            type: duration
                          timeout:
                            type: duration
                  max_concurrent_streams:
                    type: int
                  max_recv_msg_size_mib:
                    type: int
                  middlewares:
                    type: list
                    children:
                      item:
                        type: map
                        children:
                          id:
                            type: string
                  read_buffer_size:
                    type: int
                  tls:
                    type: map
                    children:
                      ca_file:
                        type: string
                      ca_pem:
                        type: string
                      cert_file:
                        type: string
                      cert_pem:
                        type: string
                      cipher_suites:
                        type: list
                        children:
                          item:
                            type: string
                      client_ca_file:
                        type: string
                      client_ca_file_reload:
                        type: bool
                      curve_preferences:
                        type: list
                        children:
                          item:
                            type: string
                      include_system_ca_certs_pool:
                        type: bool
                      key_file:
                        type: string
                      key_pem:
                        type: string
                      max_version:
                        type: string
                      min_version:
                        type: string
                      reload_interval:
                        type: duration
                      tpm:
                        type: map
                        children:
                          auth:
                            type: string
                          enabled:
                            type: bool
                          owner_auth:
                            type: string
                          path:
                            type: string
                  transport:
                    type: string
                  write_buffer_size:
                    type: int
        doc: Config defines configuration for OTel Arrow receiver.
