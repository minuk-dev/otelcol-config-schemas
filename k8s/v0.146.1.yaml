                    doc: SpanKinds specify the list of items to match the span kind against. A match occurs if the span's span kind matches at least one item in this list. This is an optional field
                  span_names:
                    type: list
                    children:
                      item:
                        type: string
                    doc: SpanNames specify the list of items to match span name against. A match occurs if the span name matches at least one item in this list. This is an optional field.
                doc: 'Exclude specifies when this processor will not be applied to the input data which match the specified properties. Note: The `exclude` properties are checked after the `include` properties, if they exist, are checked. If `include` isn''t specified, the `exclude` properties are checked against all input data. This is an optional field. If neither `include` and `exclude` are set, all input data is processed. If `exclude` is set and `include` isn''t set, then all the input data that does not match the properties in this structure are processed.'
              include:
                type: map
                children:
                  attributes:
                    type: list
                    children:
                      item:
                        type: map
                        children:
                          key:
                            type: string
                            doc: Key specifies the attribute key.
                          value:
                            type: map
                            open: true
                            doc: Values specifies the value to match against. If it is not set, any value will match.
                        doc: Attribute specifies the attribute key and optional value to match against.
                    doc: Attributes specifies the list of attributes to match against. All of these attributes must match for a match to occur. This is an optional field.
                  libraries:
                    type: list
                    children:
                      item:
                        type: map
                        children:
                          name:
                            type: string
                          version:
                            type: string
                            doc: version match expected actual  match nil      <blank> yes nil      1       yes <blank>  <blank> yes <blank>  1       no 1        <blank> no 1        1       yes
                        doc: InstrumentationLibrary specifies the instrumentation library and optional version to match against.
                    doc: Libraries specify the list of items to match the implementation library against. A match occurs if the span's implementation library matches at least one item in this list. This is an optional field.
                  log_bodies:
                    type: list
                    children:
                      item:
                        type: string
                    doc: LogBodies is a list of strings that the LogRecord's body field must match against.
                  log_severity_number:
                    type: map
                    children:
                      match_undefined:
                        type: bool
                        doc: MatchUndefined controls whether logs with "undefined" severity matches. If this is true, entries with undefined severity will match.
                      min:
                        type: int
                        doc: Min is the lowest severity that may be matched. e.g. if this is plog.SeverityNumberInfo, INFO, WARN, ERROR, and FATAL logs will match.
                    doc: LogSeverityNumber defines how to match against a log record's SeverityNumber, if defined.
                  log_severity_texts:
                    type: list
                    children:
                      item:
                        type: string
                    doc: LogSeverityTexts is a list of strings that the LogRecord's severity text field must match against.
                  match_type:
                    type: string
                    doc: MatchType describes the type of pattern matching a FilterSet uses to filter strings.
                  metric_names:
                    type: list
                    children:
                      item:
                        type: string
                    doc: MetricNames is a list of strings to match metric name against. A match occurs if metric name matches at least one item in the list. This field is optional.
                  regexp:
                    type: map
                    children:
                      cacheenabled:
                        type: bool
                        doc: CacheEnabled determines whether match results are LRU cached to make subsequent matches faster. Cache size is unlimited unless CacheMaxNumEntries is also specified.
                      cachemaxnumentries:
                        type: int
                        doc: CacheMaxNumEntries is the max number of entries of the LRU cache that stores match results. CacheMaxNumEntries is ignored if CacheEnabled is false.
                    doc: Config represents the options for a NewFilterSet.
                  resources:
                    type: list
                    children:
                      item:
                        type: map
                        children:
                          key:
                            type: string
                            doc: Key specifies the attribute key.
                          value:
                            type: map
                            open: true
                            doc: Values specifies the value to match against. If it is not set, any value will match.
                        doc: Attribute specifies the attribute key and optional value to match against.
                    doc: Resources specify the list of items to match the resources against. A match occurs if the data's resources match at least one item in this list. This is an optional field.
                  services:
                    type: list
                    children:
                      item:
                        type: string
                    doc: Services specify the list of items to match service name against. A match occurs if the span's service name matches at least one item in this list. This is an optional field.
                  span_kinds:
                    type: list
                    children:
                      item:
                        type: string
                    doc: SpanKinds specify the list of items to match the span kind against. A match occurs if the span's span kind matches at least one item in this list. This is an optional field
                  span_names:
                    type: list
                    children:
                      item:
                        type: string
                    doc: SpanNames specify the list of items to match span name against. A match occurs if the span name matches at least one item in this list. This is an optional field.
                doc: 'Include specifies the set of input data properties that must be present in order for this processor to apply to it. Note: If `exclude` is specified, the input data is compared against those properties after the `include` properties. This is an optional field. If neither `include` and `exclude` are set, all input data are processed. If `include` is set and `exclude` isn''t set, then all input data matching the properties in this structure are processed.'
            doc: 'Deprecated: use TraceConditions instead.'
          trace_conditions:
            type: list
            children:
              item:
                type: map
                children:
                  conditions:
                    type: list
                    children:
                      item:
                        type: string
                  context:
                    type: string
                  error_mode:
                    type: string
          traces:
            type: map
            children:
              resource:
                type: list
                children:
                  item:
                    type: string
                doc: ResourceConditions is a list of OTTL conditions for an ottlresource context. If any condition resolves to true, the whole resource will be dropped. Supports `and`, `or`, and `()`
              span:
                type: list
                children:
                  item:
                    type: string
                doc: SpanConditions is a list of OTTL conditions for an ottlspan context. If any condition resolves to true, the span will be dropped. Supports `and`, `or`, and `()`
              spanevent:
                type: list
                children:
                  item:
                    type: string
                doc: SpanEventConditions is a list of OTTL conditions for an ottlspanevent context. If any condition resolves to true, the span event will be dropped. Supports `and`, `or`, and `()`
            doc: 'Deprecated: use TraceConditions instead.'
        doc: Config defines configuration for Resource processor.
    groupbyattrs:
      type: groupbyattrs
      signals:
        - traces
        - metrics
        - logs
      stability:
        logs: beta
        metrics: beta
        traces: beta
      module: github.com/open-telemetry/opentelemetry-collector-contrib/processor/groupbyattrsprocessor
      fields:
        type: map
        children:
          keys:
            type: list
            children:
              item:
                type: string
            doc: GroupByKeys describes the attribute names that are going to be used for grouping. Empty value is allowed, since processor in such case can compact data
        doc: Config is the configuration for the processor.
    groupbytrace:
      type: groupbytrace
      signals:
        - traces
      stability:
        traces: beta
      module: github.com/open-telemetry/opentelemetry-collector-contrib/processor/groupbytraceprocessor
      fields:
        type: map
        children:
          discard_orphans:
            type: bool
            doc: 'DiscardOrphans instructs the processor to discard traces without the root span. This typically indicates that the trace is incomplete. Default: false. Not yet implemented, and an error will be returned when this option is used.'
          num_traces:
            type: int
            doc: 'NumTraces is the max number of traces to keep in memory waiting for the duration. Default: 1_000_000.'
          num_workers:
            type: int
            doc: 'NumWorkers is a number of workers processing event queue. Default: 1.'
          store_on_disk:
            type: bool
            doc: 'StoreOnDisk tells the processor to keep only the trace ID in memory, serializing the trace spans to disk. Useful when the duration to wait for traces to complete is high. Default: false. Not yet implemented, and an error will be returned when this option is used.'
          wait_duration:
            type: duration
            doc: 'WaitDuration tells the processor to wait for the specified duration for the trace to be complete. Default: 1s.'
        doc: Config is the configuration for the processor.
    interval:
      type: interval
      signals:
        - metrics
      stability:
        metrics: alpha
      module: github.com/open-telemetry/opentelemetry-collector-contrib/processor/intervalprocessor
      fields:
        type: map
        children:
          interval:
            type: duration
            doc: Interval is the time interval at which the processor will aggregate metrics.
          pass_through:
            type: map
            children:
              gauge:
                type: bool
                doc: Gauge is a flag that determines whether gauge metrics should be passed through as they are or aggregated.
              summary:
                type: bool
                doc: Summary is a flag that determines whether summary metrics should be passed through as they are or aggregated.
            doc: PassThrough is a configuration that determines whether gauge and summary metrics should be passed through as they are or aggregated.
        doc: Config defines the configuration for the processor.
    k8s_attributes:
      type: k8s_attributes
      signals:
        - traces
        - metrics
        - logs
        - profiles
      stability:
        logs: beta
        metrics: beta
        profiles: development
        traces: beta
      module: github.com/open-telemetry/opentelemetry-collector-contrib/processor/k8sattributesprocessor
      fields:
        type: map
        children:
          auth_type:
            type: string
            doc: How to authenticate to the K8s API server.  This can be one of `none` (for no auth), `serviceAccount` (to use the standard service account token provided to the agent pod), or `kubeConfig` to use credentials from `~/.kube/config`.
          context:
            type: string
            doc: When using auth_type `kubeConfig`, override the current context.
          exclude:
            type: map
            children:
              pods:
                type: list
                children:
                  item:
                    type: map
                    children:
                      name:
                        type: string
                    doc: ExcludePodConfig represent a Pod name to ignore
            doc: Exclude section allows to define names of pod that should be ignored while tagging.
          extract:
            type: map
            children:
              annotations:
                type: list
                children:
                  item:
                    type: map
                    children:
                      from:
                        type: string
                        doc: From represents the source of the labels/annotations. Allowed values are "pod", "namespace", and "node". The default is pod.
                      key:
                        type: string
                        doc: Key represents the annotation (or label) name. This must exactly match an annotation (or label) name.
                      key_regex:
                        type: string
                        doc: KeyRegex is a regular expression used to extract a Key that matches the regex. Out of Key or KeyRegex, only one option is expected to be configured at a time.
                      tag_name:
                        type: string
                        doc: 'TagName represents the name of the resource attribute that will be added to logs, metrics or spans. When not specified, a default tag name will be used of the format: - k8s.pod.annotations.<annotation key>  (or k8s.pod.annotation.<annotation key> when processor.k8sattributes.EmitV1K8sConventions is enabled) - k8s.pod.labels.<label key>  (or k8s.pod.label.<label key> when processor.k8sattributes.EmitV1K8sConventions is enabled) For example, if tag_name is not specified and the key is git_sha, then the attribute name will be `k8s.pod.annotations.git_sha` (or `k8s.pod.annotation.git_sha` with the feature gate). When key_regex is present, tag_name supports back reference to both named capturing and positioned capturing. For example, if your pod spec contains the following labels, app.kubernetes.io/component: mysql app.kubernetes.io/version: 5.7.21 and you''d like to add tags for all labels with prefix app.kubernetes.io/ and also trim the prefix, then you can specify the following extraction rules: extract: labels: - tag_name: $$1 key_regex: kubernetes.io/(.*) this will add the `component` and `version` tags to the spans or metrics. When key_regex is present without tag_name, the default tag name format will be used for each matched key. For example: extract: labels: - key_regex: environment\.(.*) from: pod If labels like "environment.prod" and "environment.dev" exist, they will be extracted as k8s.pod.labels.environment.prod and k8s.pod.labels.environment.dev respectively.'
                    doc: FieldExtractConfig allows specifying an extraction rule to extract a resource attribute from pod (or namespace) annotations (or labels).
                doc: Annotations allows extracting data from pod annotations and record it as resource attributes. It is a list of FieldExtractConfig type. See FieldExtractConfig documentation for more details.
              deployment_name_from_replicaset:
                type: bool
                doc: DeploymentNameFromReplicaSet allows extracting deployment name from replicaset name by trimming pod template hash. This will disable watching for replicaset resources.
              labels:
                type: list
                children:
                  item:
                    type: map
                    children:
                      from:
                        type: string
                        doc: From represents the source of the labels/annotations. Allowed values are "pod", "namespace", and "node". The default is pod.
                      key:
                        type: string
                        doc: Key represents the annotation (or label) name. This must exactly match an annotation (or label) name.
                      key_regex:
                        type: string
                        doc: KeyRegex is a regular expression used to extract a Key that matches the regex. Out of Key or KeyRegex, only one option is expected to be configured at a time.
                      tag_name:
                        type: string
                        doc: 'TagName represents the name of the resource attribute that will be added to logs, metrics or spans. When not specified, a default tag name will be used of the format: - k8s.pod.annotations.<annotation key>  (or k8s.pod.annotation.<annotation key> when processor.k8sattributes.EmitV1K8sConventions is enabled) - k8s.pod.labels.<label key>  (or k8s.pod.label.<label key> when processor.k8sattributes.EmitV1K8sConventions is enabled) For example, if tag_name is not specified and the key is git_sha, then the attribute name will be `k8s.pod.annotations.git_sha` (or `k8s.pod.annotation.git_sha` with the feature gate). When key_regex is present, tag_name supports back reference to both named capturing and positioned capturing. For example, if your pod spec contains the following labels, app.kubernetes.io/component: mysql app.kubernetes.io/version: 5.7.21 and you''d like to add tags for all labels with prefix app.kubernetes.io/ and also trim the prefix, then you can specify the following extraction rules: extract: labels: - tag_name: $$1 key_regex: kubernetes.io/(.*) this will add the `component` and `version` tags to the spans or metrics. When key_regex is present without tag_name, the default tag name format will be used for each matched key. For example: extract: labels: - key_regex: environment\.(.*) from: pod If labels like "environment.prod" and "environment.dev" exist, they will be extracted as k8s.pod.labels.environment.prod and k8s.pod.labels.environment.dev respectively.'
                    doc: FieldExtractConfig allows specifying an extraction rule to extract a resource attribute from pod (or namespace) annotations (or labels).
                doc: Labels allows extracting data from pod labels and record it as resource attributes. It is a list of FieldExtractConfig type. See FieldExtractConfig documentation for more details.
              metadata:
                type: list
                children:
                  item:
                    type: string
                doc: 'Metadata allows to extract pod/namespace/node metadata from a list of metadata fields. The field accepts a list of strings. Metadata fields supported right now are, k8s.pod.name, k8s.pod.uid, k8s.deployment.name, k8s.node.name, k8s.namespace.name, k8s.pod.start_time, k8s.replicaset.name, k8s.replicaset.uid, k8s.daemonset.name, k8s.daemonset.uid, k8s.job.name, k8s.job.uid, k8s.cronjob.name, k8s.cronjob.uid, k8s.statefulset.name, k8s.statefulset.uid, k8s.container.name, container.id, container.image.name, container.image.tag, container.image.repo_digests k8s.cluster.uid Specifying anything other than these values will result in an error. By default, the following fields are extracted and added to spans, metrics and logs as resource attributes: - k8s.pod.name - k8s.pod.uid - k8s.pod.start_time - k8s.namespace.name - k8s.node.name - k8s.deployment.name (if the pod is controlled by a deployment) - k8s.container.name (requires an additional attribute to be set: container.id) - container.image.name (requires one of the following additional attributes to be set: container.id or k8s.container.name) - container.image.tag (requires one of the following additional attributes to be set: container.id or k8s.container.name)'
              otel_annotations:
                type: bool
                doc: OtelAnnotations extracts all pod annotations with the prefix "resource.opentelemetry.io" as resource attributes E.g. "resource.opentelemetry.io/foo" becomes "foo"
            doc: Extract section allows specifying extraction rules to extract data from k8s pod specs
          filter:
            type: map
            children:
              fields:
                type: list
                children:
                  item:
                    type: map
                    children:
                      key:
                        type: string
                        doc: Key represents the key or name of the field or labels that a filter can apply on.
                      op:
                        type: string
                        doc: 'Op represents the filter operation to apply on the given Key: Value pair. The following operations are supported equals, not-equals, exists, does-not-exist.'
                      value:
                        type: string
                        doc: Value represents the value associated with the key that a filter operation specified by the `Op` field applies on.
                    doc: FieldFilterConfig allows specifying exactly one filter by a field. It can be used to represent a label or generic field filter.
                doc: 'Fields allows to filter pods by generic k8s fields. Only the following operations are supported: - equals - not-equals Check FieldFilterConfig for more details.'
              labels:
                type: list
                children:
                  item:
                    type: map
                    children:
                      key:
                        type: string
                        doc: Key represents the key or name of the field or labels that a filter can apply on.
                      op:
                        type: string
                        doc: 'Op represents the filter operation to apply on the given Key: Value pair. The following operations are supported equals, not-equals, exists, does-not-exist.'
                      value:
                        type: string
                        doc: Value represents the value associated with the key that a filter operation specified by the `Op` field applies on.
                    doc: FieldFilterConfig allows specifying exactly one filter by a field. It can be used to represent a label or generic field filter.
                doc: 'Labels allows to filter pods by generic k8s pod labels. Only the following operations are supported: - equals - not-equals - exists - not-exists Check FieldFilterConfig for more details.'
              namespace:
                type: string
                doc: Namespace filters all pods by the provided namespace. All other pods are ignored.
              node:
                type: string
                doc: Node represents a k8s node or host. If specified, any pods not running on the specified node will be ignored by the tagger.
              node_from_env_var:
                type: string
                doc: 'NodeFromEnv can be used to extract the node name from an environment variable. The value must be the name of the environment variable. This is useful when the node a Otel agent will run on cannot be predicted. In such cases, the Kubernetes downward API can be used to add the node name to each pod as an environment variable. K8s tagger can then read this value and filter pods by it. For example, node name can be passed to each agent with the downward API as follows env: - name: K8S_NODE_NAME valueFrom: fieldRef: fieldPath: spec.nodeName Then the NodeFromEnv field can be set to `K8S_NODE_NAME` to filter all pods by the node that the agent is running on. More on downward API here: https://kubernetes.io/docs/tasks/inject-data-application/environment-variable-expose-pod-information/'
            doc: Filter section allows specifying filters to filter pods by labels, fields, namespaces, nodes, etc.
          passthrough:
            type: bool
            doc: Passthrough mode only annotates resources with the pod IP and does not try to extract any other metadata. It does not need access to the K8S cluster API. Agent/Collector must receive spans directly from services to be able to correctly detect the pod IPs.
          pod_association:
            type: list
            children:
              item:
                type: map
                children:
                  sources:
                    type: list
                    children:
                      item:
                        type: map
                        children:
                          from:
                            type: string
                            doc: From represents the source of the association. Allowed values are "connection" and "resource_attribute".
                          name:
                            type: string
                            doc: Name represents extracted key name. e.g. ip, pod_uid, k8s.pod.ip
                    doc: List of pod association sources which should be taken to identify pod
                doc: PodAssociationConfig contain single rule how to associate Pod metadata with logs, spans and metrics
            doc: Association section allows to define rules for tagging spans, metrics, and logs with Pod metadata.
          wait_for_metadata:
            type: bool
            doc: WaitForMetadata is a flag that determines if the processor should wait k8s metadata to be synced when starting.
          wait_for_metadata_timeout:
            type: duration
            doc: WaitForMetadataTimeout is the maximum time the processor will wait for the k8s metadata to be synced.
        doc: Config defines configuration for k8s attributes processor.
    logdedup:
      type: logdedup
      signals:
        - logs
      stability:
        logs: alpha
      module: github.com/open-telemetry/opentelemetry-collector-contrib/processor/logdedupprocessor
      fields:
        type: map
        children:
          conditions:
            type: list
            children:
              item:
                type: string
          exclude_fields:
            type: list
            children:
              item:
                type: string
          include_fields:
            type: list
            children:
              item:
                type: string
          interval:
            type: duration
          log_count_attribute:
            type: string
          timezone:
            type: string
        doc: Config is the config of the processor.
    memory_limiter:
      type: memory_limiter
      signals:
        - traces
        - metrics
        - logs
        - profiles
      stability:
        logs: beta
        metrics: beta
        profiles: alpha
        traces: beta
      module: go.opentelemetry.io/collector/processor/memorylimiterprocessor
      fields:
        type: map
        children:
          check_interval:
            type: duration
          limit_mib:
            type: int
          limit_percentage:
            type: int
          min_gc_interval_when_hard_limited:
            type: duration
          min_gc_interval_when_soft_limited:
            type: duration
          spike_limit_mib:
            type: int
          spike_limit_percentage:
            type: int
    metricstransform:
      type: metricstransform
      signals:
        - metrics
      stability:
        metrics: beta
      module: github.com/open-telemetry/opentelemetry-collector-contrib/processor/metricstransformprocessor
      fields:
        type: map
        children:
          transforms:
            type: list
            children:
              item:
                type: map
                children:
                  action:
                    type: string
                    doc: Action specifies the action performed on the matched metric. Action specifies if the operations (specified below) are performed on metrics in place (update), on an inserted clone (insert), or on a new combined metric that includes all data points from the set of matching metrics (combine). REQUIRED
                  aggregation_type:
                    type: string
                    doc: AggregationType specifies how to aggregate. REQUIRED only if Action is COMBINE.
                  experimental_match_labels:
                    type: map
                    open: true
                    doc: MatchLabels specifies the label set against which the metric filter will work. This field is optional.
                  group_resource_labels:
                    type: map
                    open: true
                    doc: GroupResourceLabels specifies resource labels that will be appended to this group's new ResourceMetrics message REQUIRED only if Action is GROUP
                  include:
                    type: string
                    doc: Include specifies the metric(s) to operate on.
                  match_type:
                    type: string
                    doc: 'MatchType determines how the Include string is matched: <strict|regexp>.'
                  new_name:
                    type: string
                    doc: NewName specifies the name of the new metric when inserting or updating. REQUIRED only if Action is INSERT.
                  operations:
                    type: list
                    children:
                      item:
                        type: map
                        children:
                          action:
                            type: string
                            doc: Action specifies the action performed for this operation. REQUIRED
                          aggregated_values:
                            type: list
                            children:
                              item:
                                type: string
                            doc: AggregatedValues is a list of label values to aggregate away.
                          aggregation_type:
                            type: string
                            doc: AggregationType specifies how to aggregate.
                          experimental_scale:
                            type: float
                            doc: Scale is a scalar to multiply the values with.
                          label:
                            type: string
                            doc: Label identifies the exact label to operate on.
                          label_set:
                            type: list
                            children:
                              item:
                                type: string
                            doc: LabelSet is a list of labels to keep. All other labels are aggregated based on the AggregationType.
                          label_value:
                            type: string
                            doc: LabelValue identifies the exact label value to operate on
                          new_label:
                            type: string
                            doc: NewLabel determines the name to rename the identified label to.
                          new_value:
                            type: string
                            doc: NewValue is used to set a new label value either when the operation is `AggregatedValues` or `addLabel`.
                          value_actions:
                            type: list
                            children:
                              item:
                                type: map
                                children:
                                  new_value:
                                    type: string
                                    doc: NewValue specifies the label value to rename to.
                                  value:
                                    type: string
                                    doc: Value specifies the current label value.
                            doc: ValueActions is a list of renaming actions for label values.
                    doc: Operations contains a list of operations that will be performed on the resulting metric(s).
                  submatch_case:
                    type: string
                    doc: SubmatchCase specifies what case to use for label values created from regexp submatches.
            doc: transform specifies a list of transforms on metrics with each transform focusing on one metric.
        doc: Config defines configuration for Resource processor.
    probabilistic_sampler:
      type: probabilistic_sampler
      signals:
        - traces
        - logs
      stability:
        logs: alpha
        traces: beta
      module: github.com/open-telemetry/opentelemetry-collector-contrib/processor/probabilisticsamplerprocessor
      fields:
        type: map
        children:
          attribute_source:
            type: string
          fail_closed:
            type: bool
            doc: FailClosed indicates to not sample data (the processor will fail "closed") in case of error, such as failure to parse the tracestate field or missing the randomness attribute. By default, failure cases are sampled (the processor is fails "open").  Sampling priority-based decisions are made after FailClosed is processed, making it possible to sample despite errors using priority.
          from_attribute:
            type: string
            doc: FromAttribute (logs only) The optional name of a log record attribute used for sampling purposes, such as a unique log record ID. The value of the attribute is only used if the trace ID is absent or if `attribute_source` is set to `record`.
          hash_seed:
            type: int
            doc: 'HashSeed allows one to configure the hashing seed. This is important in scenarios where multiple layers of collectors have different sampling rates: if they use the same seed all passing one layer may pass the other even if they have different sampling rates, configuring different seeds avoids that.'
          mode:
            type: string
            doc: 'Mode selects the sampling behavior. Supported values: - "hash_seed": the legacy behavior of this processor. Using an FNV hash combined with the HashSeed value, this sampler performs a non-consistent probabilistic downsampling.  The number of spans output is expected to equal SamplingPercentage (as a ratio) times the number of spans inpout, assuming good behavior from FNV and good entropy in the hashed attributes or TraceID. - "equalizing": Using an OTel-specified consistent sampling mechanism, this sampler selectively reduces the effective sampling probability of arriving spans.  This can be useful to select a small fraction of complete traces from a stream with mixed sampling rates.  The rate of spans passing through depends on how much sampling has already been applied.  If an arriving span was head sampled at the same probability it passes through.  If the span arrives with lower probability, a warning is logged because it means this sampler is configured with too large a sampling probability to ensure complete traces. - "proportional": Using an OTel-specified consistent sampling mechanism, this sampler reduces the effective sampling probability of each span by `SamplingProbability`.'
          sampling_percentage:
            type: float
            doc: 'SamplingPercentage is the percentage rate at which traces or logs are going to be sampled. Defaults to zero, i.e.: no sample. Values greater or equal 100 are treated as "sample all traces/logs".'
          sampling_precision:
            type: int
            doc: SamplingPrecision is how many hex digits of sampling threshold will be encoded, from 1 up to 14.  Default is 4. 0 is treated as full precision.
          sampling_priority:
            type: string
            doc: SamplingPriority (logs only) enables using a log record attribute as the sampling priority of the log record.
        doc: Config has the configuration guiding the sampler processor.
    redaction:
      type: redaction
      signals:
        - traces
        - metrics
        - logs
      stability:
        logs: alpha
        metrics: alpha
        traces: beta
      module: github.com/open-telemetry/opentelemetry-collector-contrib/processor/redactionprocessor
      fields:
        type: map
        children:
          allow_all_keys:
            type: bool
            doc: AllowAllKeys is a flag to allow all span attribute keys. Setting this to true disables the AllowedKeys list. The list of BlockedValues is applied regardless. If you just want to block values, set this to true.
          allowed_keys:
            type: list
            children:
              item:
                type: string
            doc: AllowedKeys is a list of allowed span attribute keys. Span attributes not on the list are removed. The list fails closed if it's empty. To allow all keys, you should explicitly set AllowAllKeys
          allowed_values:
            type: list
            children:
              item:
                type: string
            doc: AllowedValues is a list of regular expressions for allowing values of blocked span attributes. Values that match are not masked.
          blocked_key_patterns:
            type: list
            children:
              item:
                type: string
            doc: BlockedKeyPatterns is a list of blocked span attribute key patterns. Span attributes matching the regexes on the list are masked.
          blocked_values:
            type: list
            children:
              item:
                type: string
            doc: BlockedValues is a list of regular expressions for blocking values of allowed span attributes. Values that match are masked.
          db_sanitizer:
            type: map
            children:
              es:
                type: map
                children:
                  attributes:
                    type: list
                    children:
                      item:
                        type: string
                    doc: Attributes specifies which attribute keys to apply Elasticsearch sanitization to. If empty, Elasticsearch sanitization is applied to all string values in log bodies but not to span/metric attributes
                  enabled:
                    type: bool
              memcached:
                type: map
                children:
                  attributes:
                    type: list
                    children:
                      item:
                        type: string
                    doc: Attributes specifies which attribute keys to apply Memcached sanitization to. If empty, Memcached sanitization is applied to all string values in log bodies but not to span/metric attributes
                  enabled:
                    type: bool
              mongo:
                type: map
                children:
                  attributes:
                    type: list
                    children:
                      item:
                        type: string
                    doc: Attributes specifies which attribute keys to apply MongoDB sanitization to. If empty, MongoDB sanitization is applied to all string values in log bodies but not to span/metric attributes
                  enabled:
                    type: bool
              opensearch:
                type: map
                children:
                  attributes:
                    type: list
                    children:
                      item:
                        type: string
                    doc: Attributes specifies which attribute keys to apply OpenSearch sanitization to. If empty, OpenSearch sanitization is applied to all string values in log bodies but not to span/metric attributes
                  enabled:
                    type: bool
              redis:
                type: map
                children:
                  attributes:
                    type: list
                    children:
                      item:
                        type: string
                    doc: Attributes specifies which attribute keys to apply Redis sanitization to. If empty, Redis sanitization is applied to all string values in log bodies but not to span/metric attributes
                  enabled:
                    type: bool
              sanitize_span_name:
                type: bool
              sql:
                type: map
                children:
                  attributes:
                    type: list
                    children:
                      item:
                        type: string
                    doc: Attributes specifies which attribute keys to apply SQL sanitization to. If empty, SQL sanitization is applied to all string values in log bodies but not to span/metric attributes
                  enabled:
                    type: bool
              valkey:
                type: map
                children:
                  attributes:
                    type: list
                    children:
                      item:
                        type: string
                    doc: Attributes specifies which attribute keys to apply Valkey sanitization to. If empty, Valkey sanitization is applied to all string values in log bodies but not to span/metric attributes
                  enabled:
                    type: bool
            doc: DBSanitizer is a flag to enable database query sanitization.
          hash_function:
            type: string
            doc: HashFunction defines the function for hashing the values instead of masking them with a fixed string. By default, no hash function is used and masking with a fixed string is performed.
          ignored_key_patterns:
            type: list
            children:
              item:
                type: string
            doc: IgnoredKeyPatterns is a list of attribute key patterns (regex) that are not redacted. attributes matching any of these patterns are allowed to pass through the filter without their values being checked or modified.
          ignored_keys:
            type: list
            children:
              item:
                type: string
            doc: IgnoredKeys is a list of span attribute keys that are not redacted. Span attributes in this list are allowed to pass through the filter without being changed or removed.
          redact_all_types:
            type: bool
            doc: RedactAllTypes of attributes, including those that are not string, by converting to a string representation. By default only string values are redacted.
          summary:
            type: string
            doc: Summary controls the verbosity level of the diagnostic attributes that the processor adds to the spans when it redacts or masks other attributes. In some contexts a list of redacted attributes leaks information, while it is valuable when integrating and testing a new configuration. Possible values are `debug`, `info`, and `silent`.
          url_sanitizer:
            type: map
            children:
              attributes:
                type: list
                children:
                  item:
                    type: string
                doc: Attributes is the list of attributes that will be sanitized.
              enabled:
                type: bool
              sanitize_span_name:
                type: bool
                doc: SanitizeSpanName controls whether span names should be sanitized.
            doc: URLSanitization is a flag to sanitize URLs by removing UUIDs, timestamps, and other non-essential information
    remotetap:
      type: remotetap
      signals:
        - traces
        - metrics
        - logs
      stability:
        logs: alpha
        metrics: alpha
        traces: alpha
      module: github.com/open-telemetry/opentelemetry-collector-contrib/processor/remotetapprocessor
      fields:
        type: map
        children:
          auth:
            type: map
            children:
              authenticator:
                type: string
                doc: AuthenticatorID specifies the name of the extension to use in order to authenticate the incoming data point.
              request_params:
                type: list
                children:
                  item:
                    type: string
                doc: RequestParameters is a list of parameters that should be extracted from the request and added to the context. When a parameter is found in both the query string and the header, the value from the query string will be used.
            doc: Auth for this receiver
          compression_algorithms:
            type: list
            children:
              item:
                type: string
            doc: 'CompressionAlgorithms configures the list of compression algorithms the server can accept. Default: ["", "gzip", "zstd", "zlib", "snappy", "deflate"]'
          cors:
            type: map
            children:
              allowed_headers:
                type: list
                children:
                  item:
                    type: string
                doc: AllowedHeaders sets what headers will be allowed in CORS requests. The Accept, Accept-Language, Content-Type, and Content-Language headers are implicitly allowed. If no headers are listed, X-Requested-With will also be accepted by default. Include "*" to allow any request header.
              allowed_origins:
                type: list
                children:
                  item:
                    type: string
                doc: AllowedOrigins sets the allowed values of the Origin header for HTTP/JSON requests to an OTLP receiver. An origin may contain a wildcard (*) to replace 0 or more characters (e.g., "http://*.domain.com", or "*" to allow any origin).
              max_age:
                type: int
                doc: MaxAge sets the value of the Access-Control-Max-Age response header. Set it to the number of seconds that browsers should cache a CORS preflight response for.
            doc: CORS configures the server for HTTP cross-origin resource sharing (CORS).
          dialer:
            type: map
            children:
              timeout:
                type: duration
          endpoint:
            type: string
            doc: Endpoint configures the listening address for the server.
          idle_timeout:
            type: duration
            doc: IdleTimeout is the maximum amount of time to wait for the next request when keep-alives are enabled. If IdleTimeout is zero, the value of ReadTimeout is used. If both are zero, there is no timeout.
          include_metadata:
            type: bool
            doc: IncludeMetadata propagates the client metadata from the incoming requests to the downstream consumers
          keep_alives_enabled:
            type: bool
            doc: KeepAlivesEnabled controls whether HTTP keep-alives are enabled. By default, keep-alives are always enabled. Only very resource-constrained environments should disable them.
          limit:
            type: map
            open: true
            doc: Limit is a float that indicates the maximum number of messages repeated through the websocket by this processor in messages per second. Defaults to 1.
          max_request_body_size:
            type: int
            doc: 'MaxRequestBodySize sets the maximum request body size in bytes. Default: 20MiB.'
          middlewares:
            type: list
            children:
              item:
                type: map
                children:
                  id:
                    type: string
                    doc: ID specifies the name of the extension to use.
                doc: Middleware defines the extension ID for a middleware component.
            doc: Middlewares are used to add custom functionality to the HTTP server. Middleware handlers are called in the order they appear in this list, with the first middleware becoming the outermost handler.
          read_header_timeout:
            type: duration
            doc: ReadHeaderTimeout is the amount of time allowed to read request headers. The connection's read deadline is reset after reading the headers and the Handler can decide what is considered too slow for the body. If ReadHeaderTimeout is zero, the value of ReadTimeout is used. If both are zero, there is no timeout.
          read_timeout:
            type: duration
            doc: ReadTimeout is the maximum duration for reading the entire request, including the body. A zero or negative value means there will be no timeout. Because ReadTimeout does not let Handlers make per-request decisions on each request body's acceptable deadline or upload rate, most users will prefer to use ReadHeaderTimeout. It is valid to use them both.
          response_headers:
            children:
              item:
                type: map
                children:
                  name:
                    type: string
                  value:
                    type: string
                    doc: String alias that is marshaled and printed in an opaque way. To recover the original value, cast it to a string.
                doc: Pair is an element of a MapList, and consists of a name and an opaque value.
            doc: Additional headers attached to each HTTP response sent to the client. Header values are opaque since they may be sensitive.
          tls:
            type: map
            children:
              ca_file:
                type: string
                doc: Path to the CA cert. For a client this verifies the server certificate. For a server this verifies client certificates. If empty uses system root CA. (optional)
              ca_pem:
                type: string
                doc: In memory PEM encoded cert. (optional)
              cert_file:
                type: string
                doc: Path to the TLS cert to use for TLS required connections. (optional)
              cert_pem:
                type: string
                doc: In memory PEM encoded TLS cert to use for TLS required connections. (optional)
              cipher_suites:
                type: list
                children:
                  item:
                    type: string
                doc: CipherSuites is a list of TLS cipher suites that the TLS transport can use. If left blank, a safe default list is used. See https://go.dev/src/crypto/tls/cipher_suites.go for a list of supported cipher suites.
              client_ca_file:
                type: string
                doc: Path to the TLS cert to use by the server to verify a client certificate. (optional) This sets the ClientCAs and ClientAuth to RequireAndVerifyClientCert in the TLSConfig. Please refer to https://godoc.org/crypto/tls#Config for more information. (optional)
              client_ca_file_reload:
                type: bool
                doc: Reload the ClientCAs file when it is modified (optional, default false)
              curve_preferences:
                type: list
                children:
                  item:
                    type: string
                doc: contains the elliptic curves that will be used in an ECDHE handshake, in preference order Defaults to empty list and "crypto/tls" defaults are used, internally.
              include_system_ca_certs_pool:
                type: bool
                doc: If true, load system CA certificates pool in addition to the certificates configured in this struct.
              key_file:
                type: string
                doc: Path to the TLS key to use for TLS required connections. (optional)
              key_pem:
                type: string
                doc: In memory PEM encoded TLS key to use for TLS required connections. (optional)
              max_version:
                type: string
                doc: MaxVersion sets the maximum TLS version that is acceptable. If not set, refer to crypto/tls for defaults. (optional)
              min_version:
                type: string
                doc: MinVersion sets the minimum TLS version that is acceptable. If not set, TLS 1.2 will be used. (optional)
              reload_interval:
                type: duration
                doc: ReloadInterval specifies the duration after which the certificate will be reloaded If not set, it will never be reloaded (optional)
              tpm:
                type: map
                children:
                  auth:
                    type: string
                  enabled:
                    type: bool
                  owner_auth:
                    type: string
                  path:
                    type: string
                    doc: The path to the TPM device or Unix domain socket. For instance /dev/tpm0 or /dev/tpmrm0.
                doc: Trusted platform module configuration
            doc: TLS struct exposes TLS client configuration.
          transport:
            type: string
          write_timeout:
            type: duration
            doc: WriteTimeout is the maximum duration before timing out writes of the response. It is reset whenever a new request's header is read. Like ReadTimeout, it does not let Handlers make decisions on a per-request basis. A zero or negative value means there will be no timeout.
        doc: ServerConfig defines settings for creating an HTTP server.
    resource:
      type: resource
      signals:
        - traces
        - metrics
        - logs
        - profiles
      stability:
        logs: beta
        metrics: beta
        profiles: development
        traces: beta
      module: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourceprocessor
      fields:
        type: map
        children:
          attributes:
            type: list
            children:
              item:
                type: map
                children:
                  action:
                    type: string
                    doc: Action specifies the type of action to perform. The set of values are {INSERT, UPDATE, UPSERT, DELETE, HASH}. Both lower case and upper case are supported. INSERT -  Inserts the key/value to attributes when the key does not exist. No action is applied to attributes where the key already exists. Either Value, FromAttribute or FromContext must be set. UPDATE -  Updates an existing key with a value. No action is applied to attributes where the key does not exist. Either Value, FromAttribute or FromContext must be set. UPSERT -  Performs insert or update action depending on the attributes containing the key. The key/value is inserted to attributes that did not originally have the key. The key/value is updated for attributes where the key already existed. Either Value, FromAttribute or FromContext must be set. DELETE  - Deletes the attribute. If the key doesn't exist, no action is performed. HASH    - Calculates the SHA-1 hash of an existing value and overwrites the value with its SHA-1 hash result. If the feature gate `coreinternal.attraction.hash.sha256` is enabled, it uses SHA2-256 instead. EXTRACT - Extracts values using a regular expression rule from the input 'key' to target keys specified in the 'rule'. If a target key already exists, it will be overridden. CONVERT  - converts the type of an existing attribute, if convertable This is a required field.
                  converted_type:
                    type: string
                    doc: ConvertedType specifies the target type of an attribute to be converted If the key doesn't exist, no action is performed. If the value cannot be converted, the original value will be left as-is
                  default_value:
                    type: map
                    open: true
                    doc: DefaultValue specifies the value to use if Value/FromAttribute/FromContext doesn't provide a value (e.g., environment variable not set, attribute doesn't exist). Only used with INSERT, UPDATE, and UPSERT actions.
                  from_attribute:
                    type: string
                    doc: FromAttribute specifies the attribute to use to populate the value. If the attribute doesn't exist, no action is performed.
                  from_context:
                    type: string
                    doc: FromContext specifies the context value to use to populate the value. The values would be searched in client.Info.Metadata. If the key doesn't exist, no action is performed. If the key has multiple values the values will be joined with `;` separator.
                  key:
                    type: string
                    doc: Key specifies the attribute to act upon. This is a required field.
                  pattern:
                    type: string
                    doc: 'A regex pattern must be specified for the action EXTRACT. It uses the attribute specified by `key'' to extract values from The target keys are inferred based on the names of the matcher groups provided and the names will be inferred based on the values of the matcher group. Note: All subexpressions must have a name. Note: The value type of the source key must be a string. If it isn''t, no extraction will occur.'
                  value:
                    type: map
                    open: true
                    doc: Value specifies the value to populate for the key. The type of the value is inferred from the configuration.
                doc: ActionKeyValue specifies the attribute key to act upon.
            doc: AttributesActions specifies the list of actions to be applied on resource attributes. The set of actions are {INSERT, UPDATE, UPSERT, DELETE, HASH, EXTRACT}.
        doc: Config defines configuration for Resource processor.
