name: schemas

# Fills this registry with a schema for every collector release it is meant to
# serve, and opens a pull request with what it generated. Schemas are data, not
# code, so they land as a reviewable commit rather than being pushed to main.
#
# What each distribution ships is read from the builder manifests that
# opentelemetry-collector-releases ships at each tag, so the schemas describe
# the binaries as built. The generator itself is cmd/schemagen in the linter,
# which is checked out below.
#
# This runs here, in the registry, rather than in the linter that produces the
# generator. The work crosses two repositories either way, and the direction
# matters: from here the linter is a public checkout needing no credential at
# all, and the writes are to this repository, which GITHUB_TOKEN already
# covers. Run from the linter it is the reverse -- the writes are cross-repo,
# so it needs a personal access token with write access here, stored as a
# secret and rotated by hand.
#
# The weekly run is what keeps the registry current. A release with no schema
# is not a gap the linter reports: "--collector-version v0.158.0" quietly falls
# back to the newest release the registry does have and checks the config
# against the wrong component set, so this has to keep up on its own rather
# than when somebody remembers.
#
# "Behind" is measured against the whole window the retention policy promises,
# not against the newest release in it. Measured by the newest alone, a hole
# further back sits behind the high-water mark, where no run would ever see it.
on:
  schedule:
    # Upstream tags roughly every other week, on no fixed day; weekly picks each
    # release up within a few days of it appearing.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      versions:
        description: Collector releases, e.g. "v0.158.0" or "v0.141.0 v0.142.0". Empty generates whatever the registry is behind on.
        required: false
        type: string
      base:
        description: Branch to build on and open the pull request against, for stacking one backfill batch on the batch before it.
        required: false
        default: main
        type: string
      linter-ref:
        description: Ref of minuk-dev/otelcol-config-lint to take cmd/schemagen from.
        required: false
        default: main
        type: string

permissions:
  contents: read

# One run at a time. Each reads the registry as it stands and generates what is
# missing from it, so two at once would both find the same releases missing and
# both generate them. Queued rather than cancelled: a run that is most of the
# way through a batch is worth letting finish.
concurrency:
  group: schemas
  cancel-in-progress: false

env:
  # Where the generator lives. Public, so it is checked out without a token.
  LINTER: minuk-dev/otelcol-config-lint
  # How many missing releases one run generates. They arrive as a single pull
  # request, so this is also how large a diff a reviewer is handed; a longer
  # backlog is caught up over the following runs, or by dispatching a batch by
  # hand.
  MAX_RELEASES: 10
  # Retention. Every release is a few megabytes across four distributions and
  # two formats, and upstream tags every other week, so the registry is kept to
  # a window: the newest RETAIN releases, plus every RETAIN_EVERY-th minor for
  # good, so a config pinned to a round release keeps resolving long after its
  # neighbours are gone.
  #
  # These two are also what "behind" means, so the window the registry is
  # filled up to and the window it is pruned back to are one number.
  RETAIN: 24
  RETAIN_EVERY: 10
  # Free space below which the module cache is dropped mid-batch. Adjacent
  # releases share module paths but pin different versions of them, so the
  # cache grows by a gigabyte or two per release rather than levelling off,
  # and a runner does not have room for ten of those on top of everything
  # else it carries. Measured on a full local backfill: the cache reached
  # 40GiB partway through, and "go list -m -e -json all" started being killed.
  MIN_FREE_GB: 8

jobs:
  # Which releases the registry is behind on. It is a job of its own so the
  # expensive half -- resolving four distributions' module graphs -- runs only
  # when there is something to generate, and so a run that finds nothing new is
  # a clean no-op rather than an empty pull request.
  discover:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.pick.outputs.versions }}
    steps:
      - name: Checkout the registry
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.base || 'main' }}
      - name: Checkout the linter
        # For "schemagen --print-version", which is how a tag is turned into
        # the release it resolves to. Public, so no token.
        uses: actions/checkout@v5
        with:
          repository: ${{ env.LINTER }}
          ref: ${{ inputs.linter-ref || 'main' }}
          path: linter
      - name: Clone the upstream release manifests
        # Blobless and unchecked-out: what is read is one file at each of a few
        # dozen tags, through "git show", so no working tree is ever needed.
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/open-telemetry/opentelemetry-collector-releases releases
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: linter/go.mod
      - name: Pick the releases to generate
        id: pick
        env:
          INPUT_VERSIONS: ${{ inputs.versions }}
        run: |
          set -euo pipefail

          # The release a tag's manifest resolves to, which is what the
          # registry files the schema under and what --collector-version has to
          # match.
          #
          # It is asked of the generator rather than worked out here. The rule
          # is dist.otelcol_version, or failing that the version most of the
          # collector's own components are pinned at, or failing that
          # dist.version, and upstream exercises all three:
          #
          #   tag v0.140.1  -> v0.140.0     a packaging re-release
          #   tag v0.146.0  -> v0.146.1     and it calls itself 0.145.0
          #   tag v0.152.1  -> v0.152.1     a release of its own, despite the .1
          #
          # Comparing tags against the index instead is what made this workflow
          # find v0.146.0 missing every week, generate it, file it under
          # v0.146.1, and find it missing again.
          resolve() {
            git -C releases show "refs/tags/$1:distributions/otelcol/manifest.yaml" \
              > "${GITHUB_WORKSPACE}/manifest.yaml" 2>/dev/null || return 1

            (cd linter && go run ./cmd/schemagen --print-version \
              --builder "core=${GITHUB_WORKSPACE}/manifest.yaml") | cut -f2
          }

          if [ -n "${INPUT_VERSIONS}" ]; then
            # Dispatched tags are generated as asked, present or not: asking
            # for them by hand is how a schema is corrected in place, and how a
            # backfill batch is placed on top of the batch before it.
            printf '%s' "${INPUT_VERSIONS}" | tr ' ,' '\n' |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V -u > tags.txt
          else
            # Read over git rather than through the releases API, which pages
            # every release note in full: megabytes, frequently a timeout, and
            # no further back than one page.
            git ls-remote --tags --refs \
              https://github.com/open-telemetry/opentelemetry-collector-releases |
              sed 's#.*refs/tags/##' |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V -u > all-tags.txt

            # Only the end of the list is worth resolving. The window is RETAIN
            # releases and several tags can collapse onto one, so a margin over
            # RETAIN covers the collapsing without resolving the whole history.
            tail -n "$((RETAIN + 10))" all-tags.txt > tags.txt
          fi

          : > resolved.txt

          while read -r tag; do
            release="$(resolve "${tag}" || true)"

            # A tag with no manifest at that path is not a distribution this
            # registry serves; upstream's oldest tags predate the layout.
            if [ -z "${release}" ]; then
              echo "${tag}: no manifest to resolve, leaving it out"

              continue
            fi

            printf '%s\t%s\n' "${release}" "${tag}" >> resolved.txt
          done < tags.txt

          # One tag per release. Where several resolve to the same one --
          # v0.146.0 and v0.146.1 both resolve to v0.146.1 -- the tag named
          # after the release is preferred, since that is the one whose own
          # numbering agrees with what is generated from it.
          awk -F'\t' '
            { if ($1 == $2 || !($1 in best)) best[$1] = $2 }
            END { for (release in best) print release "\t" best[release] }
          ' resolved.txt | sort -V > one-per-release.txt

          if [ -n "${INPUT_VERSIONS}" ]; then
            cut -f1 one-per-release.txt > picked-releases.txt
          else
            # The window this registry promises to serve, and what it holds.
            # contrib is written by every run and is the distribution a config
            # is checked against by default, so it is the one the coverage is
            # read off. The index comes from the checkout, so it describes the
            # branch being built on rather than whatever main happens to hold.
            cut -f1 one-per-release.txt | sort -V -u > releases.txt
            tail -n "${RETAIN}" releases.txt > window.txt
            jq -r '.distributions.contrib[]' index.json > have.txt

            # Oldest first. Each schema is summarised against the release
            # before it, so generating them in order is what makes those
            # summaries describe one release each.
            #
            # Milestones that fell out of the window long ago are not
            # backfilled: an old release the registry never served is a hole
            # nobody is pinned to, whereas the window is what the linter
            # resolves against every day.
            comm -23 <(sort window.txt) <(sort have.txt) |
              sort -V | head -n "${MAX_RELEASES}" > picked-releases.txt
          fi

          # Both halves travel together from here: the tag says what to check
          # out, the release says what the schema will be filed under, and
          # nothing downstream has to assume they are the same string.
          : > picked.txt

          while read -r release; do
            printf '%s %s\n' \
              "$(awk -F'\t' -v r="${release}" '$1 == r { print $2 }' one-per-release.txt)" \
              "${release}" >> picked.txt
          done < picked-releases.txt

          versions="$(jq -R -s -c 'split("\n") | map(select(length > 0))' picked.txt)"
          echo "generating ${versions}"
          echo "versions=${versions}" >> "${GITHUB_OUTPUT}"

  generate:
    needs: discover
    # Nothing to generate is the ordinary weekly outcome, and an empty run
    # should not open an empty pull request.
    if: needs.discover.outputs.versions != '[]'
    runs-on: ubuntu-latest
    permissions:
      # Writing the branch and opening the pull request, both against this
      # repository, which is the whole reason this workflow lives here.
      contents: write
      pull-requests: write
    # A batch resolves four distributions' module graphs per release. Adjacent
    # releases share nearly every module, so the module cache carries most of a
    # batch, but the first release in one is paid in full.
    timeout-minutes: 350
    steps:
      - name: Checkout the registry
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.base || 'main' }}
          # Whole history. This job commits each release as it generates it, and
          # create-pull-request then has to work out what those commits are
          # against the branch it is opening: from a depth-1 checkout it asked
          # for a depth deeper than the clone had and gave up on a branch it was
          # about to create --
          #
          #   git fetch --force --depth=21 origin schemas/v0.135.0-to-v0.145.0
          #   fatal: couldn't find remote ref schemas/v0.135.0-to-v0.145.0
          #
          # -- after having reset the working tree back to origin/main, which is
          # how the first scheduled run pushed a branch and then failed without
          # a pull request to show for it.
          fetch-depth: 0
      - name: Checkout the linter
        # Public, so no token: the generator is read, never written to.
        uses: actions/checkout@v5
        with:
          repository: ${{ env.LINTER }}
          ref: ${{ inputs.linter-ref || 'main' }}
          path: linter
      - name: Clone the upstream release manifests
        # One clone, checked out at each release in turn: a batch walks several
        # tags and actions/checkout takes a single ref. Blobless, because what
        # is read is a handful of files at each of a handful of tags, not
        # history.
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/open-telemetry/opentelemetry-collector-releases releases
      - name: Keep the checkouts out of the commit
        # Both have to live under the workspace -- actions/checkout takes a
        # path relative to it -- and the workspace is this repository, so
        # without this they are untracked files that "git add -A" would commit
        # into the registry.
        run: |
          printf '/linter/\n/releases/\n' >> .git/info/exclude
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: linter/go.mod
      - name: Generate
        id: generate
        env:
          VERSIONS: ${{ needs.discover.outputs.versions }}
        # A release at a time, each committed as it is finished. Committing as
        # the batch goes is what lets a release that cannot be resolved be
        # rolled back on its own: schemagen writes the distributions it managed
        # before reporting the one it could not, and a release in the registry
        # missing a distribution is worse than a release that is not there yet.
        run: |
          # Deliberately not -e: a failed release is handled below rather than
          # taking the rest of the batch, and the work already done, with it.
          set -uo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Dropping the cache costs the next release its downloads, which is a
          # few minutes; running out of disk costs the batch.
          reclaim_disk() {
            free="$(df -Pk . | awk 'NR == 2 { print int($4 / 1024 / 1024) }')"

            if [ "${free}" -lt "${MIN_FREE_GB}" ]; then
              echo "  ${free}GiB free, dropping the module cache"
              go clean -modcache
            fi
          }

          # The tag says what to check out; the release says what the schema is
          # filed under. They are not always the same string -- the tag
          # v0.146.0 resolves to the release v0.146.1 -- so neither is used for
          # the other's job.
          generate_one() {
            tag="$1"
            version="$2"

            reclaim_disk

            # Whatever the last release left behind -- the obi sources below,
            # most of all -- is not this one's, and would be resolved as if it
            # were.
            git -C releases clean -qfdx || return 1
            git -C releases checkout --quiet --detach "refs/tags/${tag}" || return 1

            # From v0.156.0 the contrib manifest replaces go.opentelemetry.io/obi
            # with internal/obi-src, which upstream's own script downloads.
            # Without it the module graph cannot be resolved and contrib is the
            # one distribution most configs are linted against. Releases before
            # that have neither the replace nor the script.
            if [ -x releases/scripts/prepare-obi.sh ]; then
              (cd releases && ./scripts/prepare-obi.sh otelcol-contrib) || return 1
            fi

            # The registry's own names: upstream calls these otelcol and
            # otelcol-contrib, and what a config is linted against is core and
            # contrib. Paths are absolute because the generator runs from the
            # linter checkout while writing into this one.
            (cd linter && go run ./cmd/schemagen \
              --registry "${GITHUB_WORKSPACE}" \
              --summary "${GITHUB_WORKSPACE}/release-summary.md" \
              --retain "${RETAIN}" --retain-every "${RETAIN_EVERY}" \
              --builder "core=${GITHUB_WORKSPACE}/releases/distributions/otelcol/manifest.yaml" \
              --builder "contrib=${GITHUB_WORKSPACE}/releases/distributions/otelcol-contrib/manifest.yaml" \
              --builder "k8s=${GITHUB_WORKSPACE}/releases/distributions/otelcol-k8s/manifest.yaml" \
              --builder "otlp=${GITHUB_WORKSPACE}/releases/distributions/otelcol-otlp/manifest.yaml") || return 1

            # Only the release just written: the others were checked when they
            # were generated, and re-reading everything the registry holds is
            # work that grows with the registry.
            jq -r --arg version "${version}" \
              '.distributions | to_entries[] | select(.value | index($version)) | .key' \
              index.json |
            while read -r distribution; do
              (cd linter && go run ./cmd/otelcol-config-lint run \
                --schema-location "${GITHUB_WORKSPACE}" --distribution "${distribution}" \
                --collector-version "${version}" --min-severity error \
                --ignore-missing-schemas testdata/valid) || exit 1
            done || return 1
          }

          : > summary.md
          : > generated.txt
          : > failed.txt

          # Process substitution, not a pipe, so the loop runs in this shell and
          # what it commits and appends survives it.
          while read -r tag version; do
            echo "::group::${tag} (${version})"

            if generate_one "${tag}" "${version}"; then
              git add -A
              git commit -q \
                -m "Add schemas for ${version}" \
                -m "Generated by cmd/schemagen in otelcol-config-lint."

              {
                echo "### ${version}"
                echo
                cat release-summary.md
                echo
              } >> summary.md

              echo "${version}" >> generated.txt
              echo "::endgroup::"

              continue
            fi

            # Whatever half of it reached the registry is not a release, so it
            # does not go into the pull request.
            git checkout -- .
            git clean -qfd

            echo "::endgroup::"
            echo "::error::${version} could not be generated; the batch stops here"
            echo "${version}" > failed.txt

            # The releases after it are summarised against the release before
            # them, so skipping one and carrying on would describe the gap as
            # this release's doing. They are left for the next run, which will
            # find them missing and start again from here.
            break
          done < <(printf '%s' "${VERSIONS}" | jq -r '.[]')

          if [ ! -s generated.txt ]; then
            echo "::error::no release in the batch could be generated"

            exit 1
          fi

          # What the pull request is named after is what was generated, which
          # after a failure is a shorter batch than the one discovered.
          first="$(head -1 generated.txt)"
          last="$(tail -1 generated.txt)"
          if [ "${first}" = "${last}" ]; then
            echo "branch=schemas/${first}" >> "${GITHUB_OUTPUT}"
            echo "title=Add schemas for ${first}" >> "${GITHUB_OUTPUT}"
          else
            # Naming a batch after its ends keeps a stacked backfill legible,
            # and leaves the ordinary weekly run -- one release, almost always
            # -- with a branch named for that release.
            echo "branch=schemas/${first}-to-${last}" >> "${GITHUB_OUTPUT}"
            echo "title=Add schemas for ${first} through ${last}" >> "${GITHUB_OUTPUT}"
          fi

          {
            echo "releases=$(jq -R -s -c 'split("\n") | map(select(length > 0))' generated.txt)"
            echo "failed=$(cat failed.txt)"
          } >> "${GITHUB_OUTPUT}"
      - name: Write the pull request body
        # The diff is several megabytes of generated YAML, so what a reviewer
        # reads is the summary schemagen produced beside it: the components each
        # release adds, drops, renames and moves across the beta line.
        env:
          VERSIONS: ${{ steps.generate.outputs.releases }}
          FAILED: ${{ steps.generate.outputs.failed }}
          LINTER_REF: ${{ inputs.linter-ref || 'main' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          releases="$(printf '%s' "${VERSIONS}" | jq -r 'map("`" + . + "`") | join(", ")')"

          {
            echo "Generated by [\`cmd/schemagen\`](https://github.com/minuk-dev/otelcol-config-lint/tree/${LINTER_REF}/cmd/schemagen)"
            echo "at \`${LINTER_REF}\` in [this run](${RUN_URL}), for ${releases}, out of the"
            echo 'builder manifests `opentelemetry-collector-releases` ships at those tags.'
            echo
            echo "Every generated file was linted against the linter's \`testdata/valid\`"
            echo "before this was opened, in each distribution it covers."
            echo

            # A short batch is a batch that stopped, and it is worth saying so
            # on the pull request rather than only in the run it came from.
            if [ -n "${FAILED}" ]; then
              echo "The batch stopped at \`${FAILED}\`, which could not be generated; it and the"
              echo "releases after it are left for the next run."
              echo
            fi

            echo "## What these releases change"
            echo
            echo "Each release is summarised against the one the registry served before it, so"
            echo "reading them in order reads as one release at a time."
            echo
            cat summary.md
          } > pr-body.md

          # A pull request body is capped at 65536 characters, and ten releases
          # of component churn can reach it. Losing the tail of the summary is a
          # worse outcome than losing the pull request, so it is cut here rather
          # than by the API.
          limit=60000
          if [ "$(wc -c < pr-body.md)" -gt "${limit}" ]; then
            head -c "${limit}" pr-body.md > pr-body-cut.md
            mv pr-body-cut.md pr-body.md
            printf '\n\n_Summary truncated; the whole of it is in [the run](%s)._\n' \
              "${RUN_URL}" >> pr-body.md
          fi

          {
            echo
            echo "---"
            echo
            echo "Do not edit these by hand; they are regenerated from upstream."
          } >> pr-body.md
      - name: Open a pull request
        uses: peter-evans/create-pull-request@v8
        with:
          base: ${{ inputs.base || 'main' }}
          branch: ${{ steps.generate.outputs.branch }}
          title: ${{ steps.generate.outputs.title }}
          # A release that adds components and removes none is safe to merge on
          # sight; the labels are what an automerge rule would key off, the way
          # one would for a dependency bump.
          labels: |
            schemas
            automated
          # Each release was committed as it was generated, so there is nothing
          # left for this to commit; it is here for the case where a future
          # change leaves something behind.
          commit-message: |
            ${{ steps.generate.outputs.title }}

            Generated by cmd/schemagen in otelcol-config-lint.
          body-path: pr-body.md
      - name: Report a batch that stopped early
        # After the pull request, so the releases that did generate are opened
        # for review even though the run ends in failure.
        if: always() && steps.generate.outputs.failed != ''
        run: |
          echo "${{ steps.generate.outputs.failed }} could not be generated"

          exit 1
